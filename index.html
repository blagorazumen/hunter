<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ксюшачка^</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; color: #fff; font-family: 'Courier New', monospace; 
            overflow: hidden; touch-action: none; user-select: none;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: none; justify-content: space-between; z-index: 100;
            pointer-events: none;
        }
        .ui-stats { text-align: left; font-size: 20px; color: #ff00ff; font-weight: bold; }
        .ui-stats div { margin-bottom: 5px; }
        .pill-text { color: #ffff00 !important; }
        .score-text { color: #00ffff !important; }
        .ui-controls { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        
        .btn-action {
            background: #ff00ff; border: 2px solid #ff00ff; padding: 10px 14px;
            color: #fff; font-size: 13px; border-radius: 8px; cursor: pointer;
            font-weight: bold; min-width: 130px; box-shadow: 0 4px #990099;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #990099; }
        .btn-buy { background: #00ffff; border-color: #00ffff; box-shadow: 0 4px #009999; color: #000; }
        
        .btn-pause {
            position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,0,255,0.3); border: 2px solid #ff00ff;
            color: #fff; font-size: 18px; display: none; justify-content: center;
            align-items: center; cursor: pointer; z-index: 101; pointer-events: auto;
        }
        
        .screen {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
            backdrop-filter: blur(5px);
        }
                .screen.active { display: flex; }
        
        h1 { color: #ff00ff; font-size: 42px; text-shadow: 3px 3px #00ffff33; margin-bottom: 20px; letter-spacing: 2px; }
        h2 { color: #00ffff; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; }
        
        .menu-btn {
            background: #ff00ff; border: 2px solid #ff00ff;
            padding: 15px 30px; color: #fff; font-size: 18px;
            border-radius: 60px; cursor: pointer; font-weight: bold;
            margin: 8px 0; width: min(280px, 90%); box-shadow: 0 5px #990099;
            transition: all 0.05s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0 1px #990099; }
        .btn-secondary { background: #00ffff; border-color: #00ffff; box-shadow: 0 5px #009999; color: #000; }
        .btn-outline { background: transparent; color: #ff00ff; border: 2px solid #ff00ff; box-shadow: none; }
        .btn-outline:active { transform: translateY(2px); background: #ff00ff22; }
        
        .player-profile {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
            padding: 12px 25px; background: rgba(255,0,255,0.1);
            border: 2px solid #ff00ff; border-radius: 60px;
            width: min(320px, 90%);
        }
        .player-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(145deg, #ff00ff, #00ffff);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold;
        }
        .player-info { text-align: left; flex: 1; }
        .player-name { color: #00ffff; font-weight: bold; font-size: 16px; }
        .player-best { color: #ff00ff; font-size: 14px; }
        
        #leaderboard {
            width: min(90%, 340px); margin: 20px 0;
            background: rgba(0,255,255,0.05); border: 2px solid #00ffff;
            border-radius: 20px; padding: 15px; font-size: 14px;
            max-height: 35vh; overflow-y: auto;
        }
        .leader-item {
            display: flex; justify-content: space-between;
            border-bottom: 1px solid #ff00ff33; padding: 8px 5px;
        }
        
        .skins-grid {
            display: grid; grid-template-columns: 1fr; gap: 12px;
            width: min(340px, 100%); margin: 20px 0;
        }        .skin-card {
            background: rgba(255,0,255,0.1); border: 2px solid #ff00ff;
            border-radius: 16px; padding: 15px;
            display: flex; align-items: center; gap: 15px;
            transition: 0.1s; cursor: pointer;
        }
        .skin-card:hover { background: rgba(255,0,255,0.2); }
        .skin-card.selected { border-color: #00ffff; background: rgba(0,255,255,0.15); }
        .skin-preview { 
            font-size: 42px; 
            width: 60px; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        .skin-info { flex: 1; }
        .skin-name { color: #fff; font-size: 18px; font-weight: bold; }
        .skin-desc { color: #aaa; font-size: 13px; }
        .skin-check { 
            font-size: 24px; 
            color: #00ffff; 
            opacity: 0; 
            transition: 0.1s;
        }
        .skin-card.selected .skin-check { opacity: 1; }
        
        .back-btn {
            background: transparent; border: 2px solid #ff00ff;
            color: #ff00ff; margin-top: 15px; width: min(200px, 80%);
        }
        
        #death-screen h1 { color: #00ffff; }
        #death-msg { color: #ff00ff; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        .death-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .death-buttons .menu-btn { width: 130px; margin: 0; }
        
        #cutscene {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; flex-direction: column; justify-content: center;
            align-items: center; z-index: 300;
        }
        #cutscene img { max-width: 95%; max-height: 70vh; border: 3px solid #ff00ff; border-radius: 8px; }
        
        .save-status { font-size: 11px; color: #00ff00; margin-top: 10px; }
        
        .menu-container {
            display: flex; flex-direction: column; align-items: center;            width: 100%; max-width: 400px;
        }

        /* Отладочная консоль */
        #debug-console {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9); color: #0f0;
            font-size: 10px; padding: 10px; max-height: 100px;
            overflow-y: auto; z-index: 999; display: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Игровой UI -->
    <div id="ui">
        <div class="ui-stats">
            <div class="score-text">SCORE: <span id="score">0</span></div>
            <div class="pill-text">PILLS: <span id="pills-count">0</span></div>
        </div>
        <div class="ui-controls">
            <button id="buy-btn" class="btn-action btn-buy" onclick="buyBoost()">КУПИТЬ (10💊)</button>
            <button id="boost-btn" class="btn-action" onclick="activateBoost()">БУСТ: <span id="boost-count">0</span></button>
        </div>
    </div>
    
    <button id="pause-btn" class="btn-pause" onclick="togglePause()">⏸</button>
    
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen active">
        <div class="menu-container">
            <h1>КСЮШАЧКА^</h1>
            
            <div class="player-profile">
                <div class="player-avatar" id="player-avatar">👤</div>
                <div class="player-info">
                    <div class="player-name" id="player-name">Игрок</div>
                    <div class="player-best">Лучший: <span id="best-score">0</span></div>
                </div>
            </div>

            <div id="leaderboard">
                <div style="font-weight:bold; color:#00ffff; margin-bottom:12px; text-align:center;">🏆 ЛИДЕРЫ 🏆</div>
                <div id="leader-list">Загрузка...</div>
            </div>

            <button class="menu-btn" onclick="startGame('FREE')">🏃 ИГРАТЬ</button>
            <button class="menu-btn btn-secondary" onclick="showSkins()">🎨 СКИНЫ</button>
            
            <div class="save-status" id="menu-save-status"></div>        </div>
    </div>

    <!-- ВЫБОР СКИНОВ -->
    <div id="skins-menu" class="screen">
        <h2>ВЫБОР СКИНА</h2>
        <div style="color:#00ffff; font-size:16px; margin-bottom:15px;">Выбери свой стиль</div>
        
        <div class="skins-grid" id="skins-list"></div>
        
        <button class="menu-btn btn-outline back-btn" onclick="hideSkins()">◀ НАЗАД</button>
    </div>

    <!-- ЭКРАН СМЕРТИ -->
    <div id="death-screen" class="screen">
        <h1>💀 ППЦ ;(</h1>
        <div id="death-msg"></div>
        <div style="font-size:28px; margin:15px 0; color:#ffff00">СЧЁТ: <span id="final-score">0</span></div>
        <div class="death-buttons">
            <button class="menu-btn" onclick="restartGame()">ЕЩЁ</button>
            <button class="menu-btn btn-secondary" onclick="returnToMainMenu()">МЕНЮ</button>
        </div>
    </div>
    
    <!-- ПАУЗА -->
    <div id="pause-screen" class="screen">
        <h1>⏸ ПАУЗА</h1>
        <button class="menu-btn" onclick="togglePause()">▶ ПРОДОЛЖИТЬ</button>
        <button class="menu-btn btn-secondary" onclick="returnToMainMenu()">🏠 В МЕНЮ</button>
    </div>

    <canvas id="game"></canvas>
    <div id="debug-console"></div>

<script>
// === ОТЛАДКА ===
const DEBUG = true;
function log(msg) {
    if (!DEBUG) return;
    console.log('[KSSHASHKA]', msg);
    const consoleEl = document.getElementById('debug-console');
    if (consoleEl) {
        consoleEl.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }
}

// Supabase
const SUPABASE_URL = 'https://rfjruwbeiaahegzmowcc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmanJ1d2JlaWFhaGVnem1vd2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDMyMjgsImV4cCI6MjA4OTUxOTIyOH0.59jjm9JpMy3m8oZXTfomS4PuTYjDgTfZiSfhCNksPt8';const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
log('Supabase client created');

// Telegram
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const playerName = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Player";
document.getElementById('player-name').innerText = playerName;
log('Player name: ' + playerName);

// Settings
let settings = { haptic: true };
function loadSettings() {
    try {
        const s = localStorage.getItem('ksshashka_settings');
        if (s) settings = JSON.parse(s);
    } catch(e) { log('Settings load error: ' + e.message); }
}
function saveSettings() { 
    try { localStorage.setItem('ksshashka_settings', JSON.stringify(settings)); } catch(e) {}
}
loadSettings();

// Game vars
let pillsDb = 0, boostsDb = 0, bestScore = 0;
let gameState = 'MENU', gameMode = 'FREE', score = 0;
let gameSpeed = 7.2, houseX = -5000;
let isBoostActive = false, boostFrames = 0, isPaused = false;

// Скины
let selectedSkin = localStorage.getItem('selectedSkin') || 'default';

const skins = {
    'default': { emoji: '👤', name: 'Дефолт', desc: 'Классическая Ксюша' },
    'sport': { emoji: '🏃', name: 'Спорт', desc: 'Треки и кроссы' }
};

// Haptic
function haptic(type) {
    if (!settings.haptic) return;
    try {
        if (tg.HapticFeedback?.impactOccurred) {
            tg.HapticFeedback.impactOccurred(type || 'light');
        }
    } catch(e) {}
}

// Управление экранами
function showSkins() {    document.getElementById('main-menu').classList.remove('active');
    document.getElementById('skins-menu').classList.add('active');
    updateSkinsDisplay();
    log('Shop opened');
}

function hideSkins() {
    document.getElementById('skins-menu').classList.remove('active');
    document.getElementById('main-menu').classList.add('active');
    log('Shop closed');
}

function returnToMainMenu() {
    gameState = 'MENU';
    document.getElementById('death-screen').classList.remove('active');
    document.getElementById('pause-screen').classList.remove('active');
    document.getElementById('skins-menu').classList.remove('active');
    document.getElementById('main-menu').classList.add('active');
    document.getElementById('ui').style.display = 'none';
    document.getElementById('pause-btn').style.display = 'none';
    
    try { tg.BackButton.hide(); } catch(e) {}
    loadLeaderboard();
    fetchUserData();
    log('Returned to main menu');
}

// Выбор скинов
function updateSkinsDisplay() {
    const skinsEl = document.getElementById('skins-list');
    skinsEl.innerHTML = '';
    
    Object.entries(skins).forEach(([id, skin]) => {
        const selected = selectedSkin === id;
        
        const card = document.createElement('div');
        card.className = `skin-card ${selected ? 'selected' : ''}`;
        card.onclick = () => selectSkin(id);
        card.innerHTML = `
            <div class="skin-preview">${skin.emoji}</div>
            <div class="skin-info">
                <div class="skin-name">${skin.name}</div>
                <div class="skin-desc">${skin.desc}</div>
            </div>
            <div class="skin-check">✓</div>
        `;
        skinsEl.appendChild(card);
    });
    log('Skins display updated');
}
function selectSkin(skinId) {
    selectedSkin = skinId;
    localStorage.setItem('selectedSkin', skinId);
    document.getElementById('player-avatar').innerText = skins[skinId].emoji;
    loadSkinSprites(skinId);
    haptic('success');
    updateSkinsDisplay();
    quickSave();
    log('Skin selected: ' + skinId);
}

// Загрузка спрайтов для скина
function loadSkinSprites(skinName) {
    log('Loading sprites for: ' + skinName);
    
    imgs.run[0] = new Image();
    imgs.run[1] = new Image();
    imgs.run[2] = new Image();
    imgs.jump = new Image();
    
    imgs.run[0].src = `${skinName}_run_1.png`;
    imgs.run[1].src = `${skinName}_run_2.png`;
    imgs.run[2].src = `${skinName}_run_3.png`;
    imgs.jump.src = `${skinName}_jump.png`;
    
    // Отладка загрузки
    imgs.run[0].onload = () => log('Loaded: ' + skinName + '_run_1.png');
    imgs.run[0].onerror = () => log('ERROR: ' + skinName + '_run_1.png not found');
    imgs.jump.onload = () => log('Loaded: ' + skinName + '_jump.png');
    imgs.jump.onerror = () => log('ERROR: ' + skinName + '_jump.png not found');
}

// Supabase функции
async function fetchUserData() {
    document.getElementById('menu-save-status').innerText = '⏳ Загрузка...';
    log('Fetching user data...');
    
    try {
        const { data, error } = await _supabase.from('records').select('*').eq('username', playerName).single();
        
        if (error) {
            log('Supabase error: ' + error.message);
            throw error;
        }
        
        if (data) {
            pillsDb = data.pills || 0;
            boostsDb = data.speed || 0;
            bestScore = data.score || 0;            
            if (data.selectedSkin) {
                selectedSkin = data.selectedSkin;
                localStorage.setItem('selectedSkin', data.selectedSkin);
            }
            
            document.getElementById('pills-count').innerText = pillsDb;
            document.getElementById('boost-count').innerText = boostsDb;
            document.getElementById('best-score').innerText = bestScore;
            document.getElementById('menu-save-status').innerText = '✓ Синхронизировано';
            log('User data loaded successfully');
        }
        
        document.getElementById('player-avatar').innerText = skins[selectedSkin]?.emoji || '👤';
        loadSkinSprites(selectedSkin);
        
    } catch(e) {
        log('DB error: ' + e.message);
        document.getElementById('menu-save-status').innerText = '⚠ Офлайн режим';
        document.getElementById('player-avatar').innerText = skins[selectedSkin]?.emoji || '👤';
        loadSkinSprites(selectedSkin);
    }
}

async function quickSave() {
    try {
        const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
        
        if (data) {
            await _supabase.from('records').update({ 
                pills: pillsDb, 
                speed: boostsDb,
                selectedSkin: selectedSkin
            }).eq('username', playerName);
        } else {
            await _supabase.from('records').insert([{ 
                username: playerName, 
                score: bestScore, 
                pills: pillsDb, 
                speed: boostsDb,
                selectedSkin: selectedSkin
            }]);
        }
        log('Data saved');
    } catch(e) {
        log('Save failed: ' + e.message);
    }
}

async function saveProgress(s) {    if (s > bestScore) bestScore = s;
    try {
        const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
        
        if (data) {
            await _supabase.from('records').update({ 
                score: bestScore, 
                pills: pillsDb, 
                speed: boostsDb,
                selectedSkin: selectedSkin
            }).eq('username', playerName);
        } else {
            await _supabase.from('records').insert([{ 
                username: playerName, 
                score: bestScore, 
                pills: pillsDb, 
                speed: boostsDb,
                selectedSkin: selectedSkin
            }]);
        }
        loadLeaderboard();
        log('Progress saved: ' + s);
    } catch(e) {
        log('Progress save failed: ' + e.message);
    }
}

async function loadLeaderboard() {
    const list = document.getElementById('leader-list');
    list.innerHTML = 'Загрузка...';
    log('Loading leaderboard...');
    
    try {
        const { data, error } = await _supabase.from('records').select('*').order('score', { ascending: false }).limit(10);
        
        if (error) throw error;
        
        if (data && data.length > 0) {
            list.innerHTML = data.map((p, i) => 
                `<div class="leader-item"${p.username===playerName?' style="color:#ff0"':''}>
                    <span>${i+1}. ${p.username.substring(0,12)}</span>
                    <span>${p.score} 💊${p.pills||0}</span>
                </div>`
            ).join('');
            log('Leaderboard loaded: ' + data.length + ' players');
        } else {
            list.innerHTML = 'Пока пусто...';
            log('Leaderboard empty');
        }
    } catch(e) {        log('Leaderboard error: ' + e.message);
        list.innerHTML = 'Не удалось загрузить';
    }
}

// Canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
    log('Canvas resized: ' + canvas.width + 'x' + canvas.height);
}
resize();
window.addEventListener('resize', resize);
const groundY = canvas.height - (canvas.height / 3.5);

// Images
const imgs = {
    bg: new Image(), beer: new Image(), pills: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()], house: new Image()
};

// Загрузка изображений с отладкой
function loadImage(name, src) {
    imgs[name].src = src;
    imgs[name].onload = () => log('Image loaded: ' + name);
    imgs[name].onerror = () => log('IMAGE ERROR: ' + name + ' (' + src + ')');
}

loadImage('bg', 'bg.png');
loadImage('beer', 'beer.png');
loadImage('pills', 'pills.png');
loadImage('house', 'house.png');

// Player
const player = { x: 50, y: groundY - 110, w: 90, h: 110, dy: 0, jf: 17.5, g: 0.75, grounded: false, frame: 0, tick: 0 };
let obstacles = [], collectables = [], particles = [], screenShake = 0;

// Buy boost
function buyBoost() {
    const btn = document.getElementById('buy-btn');
    if (pillsDb >= 10) {
        pillsDb -= 10; boostsDb += 1;
        document.getElementById('pills-count').innerText = pillsDb;
        document.getElementById('boost-count').innerText = boostsDb;
        haptic('success'); quickSave();
        btn.innerText = 'КУПЛЕНО!';
        setTimeout(() => btn.innerText = 'КУПИТЬ (10💊)', 1000);
        log('Boost purchased');    } else {
        haptic('error');
        btn.innerText = 'МАЛО 💊!';
        btn.style.background = '#f44';
        setTimeout(() => { btn.innerText = 'КУПИТЬ (10💊)'; btn.style.background = '#0ff'; }, 1000);
        log('Not enough pills for boost');
    }
}

// Activate boost
function activateBoost() {
    if (boostsDb > 0 && !isBoostActive && gameState === 'PLAYING' && !isPaused) {
        boostsDb--; isBoostActive = true; boostFrames = 300;
        document.getElementById('boost-count').innerText = boostsDb;
        haptic('heavy'); quickSave();
        log('Boost activated');
    }
}

// Start game
function startGame(mode) {
    gameMode = mode; 
    gameState = 'PLAYING'; 
    isPaused = false; 
    score = 0; 
    houseX = -5000;
    obstacles = []; 
    collectables = []; 
    particles = []; 
    isBoostActive = false; 
    boostFrames = 0;
    player.y = groundY - player.h; 
    player.dy = 0; 
    player.grounded = true;
    
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('ui').style.display = 'flex';    
    document.getElementById('pause-btn').style.display = 'flex';
    document.getElementById('score').innerText = '0';
    
    try { tg.BackButton.show(); tg.BackButton.onClick(() => togglePause()); } catch(e) {}
    haptic('light');
    log('Game started: ' + mode);
}

function restartGame() {
    startGame(gameMode);
}

function togglePause() {    if (gameState !== 'PLAYING') return;
    isPaused = !isPaused;
    if (isPaused) {
        document.getElementById('pause-screen').classList.add('active');
    } else {
        document.getElementById('pause-screen').classList.remove('active');
    }
    log('Pause: ' + isPaused);
}

// Update
function update() {
    if (gameState !== 'PLAYING' || isPaused) return;
    
    const speed = isBoostActive ? gameSpeed * 3 : gameSpeed;
    
    if (isBoostActive) {
        boostFrames--;
        if (boostFrames <= 0) { isBoostActive = false; canvas.style.filter = 'none'; }
        else canvas.style.filter = `hue-rotate(${boostFrames*8}deg) saturate(2)`;
    }
    
    player.dy += player.g;
    player.y += player.dy;
    if (player.y + player.h > groundY) { player.y = groundY - player.h; player.dy = 0; player.grounded = true; }
    else player.grounded = false;
    
    if (player.grounded) { player.tick++; if (player.tick % 7 === 0) player.frame = (player.frame + 1) % 3; }
    
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        const o = obstacles[i];
        
        if (!isBoostActive && player.x + 35 < o.x + o.w && player.x + player.w - 35 > o.x && 
            player.y + 10 < o.y + o.h && player.y + player.h > o.y + 10) {
            gameState = 'DEAD';
            screenShake = 20;
            haptic('heavy');
            if (gameMode === 'FREE') saveProgress(score);
            
            document.getElementById('death-msg').innerText = 'ПОТРАЧЕНО';
            document.getElementById('final-score').innerText = score;
            canvas.style.filter = 'none';
            document.getElementById('ui').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('death-screen').classList.add('active');
            
            try { tg.BackButton.hide(); } catch(e) {}
            log('Player died, score: ' + score);
        }        
        if (o.x + o.w < 0) { obstacles.splice(i, 1); score++; document.getElementById('score').innerText = score; }
    }
    
    for (let i = collectables.length - 1; i >= 0; i--) {
        collectables[i].x -= speed;
        const c = collectables[i];
        
        if (player.x < c.x + c.w && player.x + player.w > c.x && player.y < c.y + c.h && player.y + player.h > c.y) {
            pillsDb++;
            document.getElementById('pills-count').innerText = pillsDb;
            createParticles(c.x + c.w/2, c.y + c.h/2, 8, '#ff0');
            haptic('light');
            collectables.splice(i, 1);
        } else if (c.x + c.w < 0) {
            collectables.splice(i, 1);
        }
    }
    
    if (Math.random() < 0.04 && 
        (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 300)) {
        obstacles.push({ x: canvas.width, y: groundY - 75, w: 45, h: 75 });
    }
    if (Math.random() < 0.015 && collectables.length === 0) {
        collectables.push({ x: canvas.width, y: groundY - 140, w: 40, h: 40 });
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    if (screenShake > 0) {
        screenShake--;
        canvas.style.transform = `translate(${(Math.random()-0.5)*screenShake}px, ${(Math.random()-0.5)*screenShake}px)`;
    } else {
        canvas.style.transform = 'none';
    }
}

// Draw
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Фон
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (imgs.bg.complete && imgs.bg.naturalWidth > 0) {
        ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    }
    
    if (gameState === 'PLAYING' || gameState === 'DEAD') {
        // Препятствия
        obstacles.forEach(o => {
            if (imgs.beer.complete && imgs.beer.naturalWidth > 0) {
                ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h);
            } else {
                ctx.fillStyle = '#f60';
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
        });
        
        // Таблетки
        collectables.forEach(c => {
            if (imgs.pills.complete && imgs.pills.naturalWidth > 0) {
                ctx.drawImage(imgs.pills, c.x, c.y, c.w, c.h);
            } else {
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(c.x+c.w/2, c.y+c.h/2, c.w/2, 0, Math.PI*2);
                ctx.fill();
            }
        });
        
        // Игрок
        const cur = player.grounded ? imgs.run[player.frame] : imgs.jump;
        if (cur?.complete && cur.naturalWidth > 0) {
            ctx.drawImage(cur, player.x, player.y, player.w, player.h);
        } else {
            // Fallback - цветной прямоугольник
            ctx.fillStyle = isBoostActive ? '#0ff' : '#f0f';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
        
        // Частицы
        particles.forEach(p => {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }
    
    requestAnimationFrame(draw);
}
function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 30 + Math.random() * 20,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

function jump(e) {
    if (gameState === 'PLAYING' && !isPaused && player.grounded && e.target.tagName !== 'BUTTON') {
        player.dy = -player.jf;
        player.grounded = false;
        haptic('medium');
        log('Jump!');
    }
}
window.addEventListener('touchstart', jump);
window.addEventListener('mousedown', jump);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') jump(e);
    if (e.code === 'Escape') togglePause();
});

// Init
log('=== GAME INIT ===');
fetchUserData();
loadLeaderboard();
setInterval(update, 1000/60);
draw();
log('Game loop started');
</script>
