<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ксюшачка^</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; color: #fff; font-family: 'Courier New', monospace; 
            overflow: hidden; touch-action: none; user-select: none;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: none; justify-content: space-between; z-index: 100;
            pointer-events: none;
        }
        .ui-stats { text-align: left; font-size: 20px; color: #ff00ff; font-weight: bold; }
        .ui-stats div { margin-bottom: 5px; }
        .pill-text { color: #ffff00 !important; }
        .score-text { color: #00ffff !important; }
        .ui-controls { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        
        .btn-action {
            background: #ff00ff; border: 2px solid #ff00ff; padding: 10px 14px;
            color: #fff; font-size: 13px; border-radius: 8px; cursor: pointer;
            font-weight: bold; min-width: 130px; box-shadow: 0 4px #990099;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px #990099; }
        .btn-buy { background: #00ffff; border-color: #00ffff; box-shadow: 0 4px #009999; color: #000; }
        
        .btn-pause {
            position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
            border-radius: 50%; background: rgba(255,0,255,0.3); border: 2px solid #ff00ff;
            color: #fff; font-size: 18px; display: none; justify-content: center;
            align-items: center; cursor: pointer; z-index: 101; pointer-events: auto;
        }
        
        #menu, #death-screen, #pause-screen {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
        }
        
        h1 { color: #ff00ff; font-size: 36px; text-shadow: 3px 3px #000; margin-bottom: 20px; }        
        .menu-btn {
            background: #ff00ff; border: 2px solid #ff00ff;
            padding: 15px 30px; color: #fff; font-size: 16px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
            margin: 8px 0; width: min(260px, 85%); box-shadow: 0 5px #990099;
        }
        .menu-btn:active { transform: translateY(3px); box-shadow: 0 2px #990099; }
        .btn-free { background: #00ffff; border-color: #00ffff; box-shadow: 0 5px #009999; color: #000; }
        
        .player-profile {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            padding: 10px 15px; background: rgba(0,255,255,0.1);
            border: 1px solid #00ffff; border-radius: 8px;
        }
        .player-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(145deg, #ff00ff, #00ffff);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
        }
        .player-info { text-align: left; }
        .player-name { color: #00ffff; font-weight: bold; font-size: 14px; }
        .player-best { color: #ff00ff; font-size: 12px; }
        
        #leaderboard {
            margin-top: 20px; width: min(90%, 320px);
            background: rgba(255,0,255,0.1); border: 1px solid #ff00ff;
            border-radius: 8px; padding: 12px; font-size: 12px;
            max-height: 30vh; overflow-y: auto;
        }
        .leader-item {
            display: flex; justify-content: space-between;
            border-bottom: 1px dashed #444; padding: 5px 0;
        }
        
        #death-screen h1 { color: #00ffff; }
        #death-msg { color: #ff00ff; font-size: 20px; margin-bottom: 20px; font-weight: bold; }
        
        #cutscene {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; flex-direction: column; justify-content: center;
            align-items: center; z-index: 300;
        }
        #cutscene img { max-width: 95%; max-height: 70vh; border: 3px solid #ff00ff; border-radius: 8px; }
        
        .save-status { font-size: 11px; color: #00ff00; margin-top: 10px; }
    </style>
</head>
<body>    <div id="ui">
        <div class="ui-stats">
            <div class="score-text">SCORE: <span id="score">0</span></div>
            <div class="pill-text">PILLS: <span id="pills-count">0</span></div>
        </div>
        <div class="ui-controls">
            <button id="buy-btn" class="btn-action btn-buy" onclick="buyBoost()">КУПИТЬ (10💊)</button>
            <button id="boost-btn" class="btn-action" onclick="activateBoost()">БУСТ: <span id="boost-count">0</span></button>
        </div>
    </div>
    
    <button id="pause-btn" class="btn-pause" onclick="togglePause()">⏸</button>
    
    <div id="menu" style="display:flex;">
        <h1>✨ КСЮШАЧКА^ ✨</h1>
        <div class="player-profile">
            <div class="player-avatar">👤</div>
            <div class="player-info">
                <div class="player-name" id="player-name">Игрок</div>
                <div class="player-best">Лучший: <span id="best-score">0</span></div>
            </div>
        </div>
        <button class="menu-btn" onclick="startGame('STORY')">📖 СЮЖЕТ</button>
        <button class="menu-btn btn-free" onclick="startGame('FREE')">🎮 СВОБОДНЫЙ ЗАБЕГ</button>
        <div id="leaderboard">
            <div style="font-weight:bold;color:#00ffff;margin-bottom:8px;">🏅 ТОП-10:</div>
            <div id="leader-list">Нажми чтобы обновить</div>
        </div>
        <div class="save-status" id="menu-save-status"></div>
    </div>

    <div id="death-screen">
        <h1>💀 ППЦ;)</h1>
        <div id="death-msg"></div>
        <div style="margin-bottom:20px;color:#ffff00">Счёт: <span id="final-score">0</span></div>
        <button class="menu-btn" onclick="returnToMenu()">🏠 В МЕНЮ</button>
    </div>
    
    <div id="pause-screen">
        <h1>⏸ ПАУЗА</h1>
        <button class="menu-btn" onclick="togglePause()">▶ ПРОДОЛЖИТЬ</button>
        <button class="menu-btn btn-free" onclick="returnToMenu()">🏠 В МЕНЮ</button>
    </div>

    <div id="cutscene">
        <img id="cutscene-img" src="" alt="">
        <button id="next-btn" class="menu-btn" style="margin-top:20px">ДАЛЕЕ →</button>
    </div>

    <canvas id="game"></canvas>
<script>
// Supabase
const SUPABASE_URL = 'https://rfjruwbeiaahegzmowcc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmanJ1d2JlaWFhaGVnem1vd2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDMyMjgsImV4cCI6MjA4OTUxOTIyOH0.59jjm9JpMy3m8oZXTfomS4PuTYjDgTfZiSfhCNksPt8';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Telegram
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const playerName = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Player";
document.getElementById('player-name').innerText = playerName;

// Settings
let settings = { haptic: true };
function loadSettings() {
    try {
        const s = localStorage.getItem('ksshashka_settings');
        if (s) settings = JSON.parse(s);
    } catch(e) {}
}
function saveSettings() { 
    try { localStorage.setItem('ksshashka_settings', JSON.stringify(settings)); } catch(e) {}
}
loadSettings();

// Game vars
let pillsDb = 0, boostsDb = 0, bestScore = 0;
let gameState = 'MENU', gameMode = 'STORY', score = 0;
let gameSpeed = 7.2, houseX = -5000;
let isBoostActive = false, boostFrames = 0, isPaused = false;

// Haptic
function haptic(type) {
    if (!settings.haptic) return;
    try {
        if (tg.HapticFeedback?.impactOccurred) {
            tg.HapticFeedback.impactOccurred(type || 'light');
        }
    } catch(e) {}
}

// Supabase functions with timeout
async function fetchUserData() {
    document.getElementById('menu-save-status').innerText = '⏳ Загрузка...';
    
    try {
        const promise = _supabase.from('records').select('*').eq('username', playerName).single();
        const timeout = new Promise((_, reject) =>             setTimeout(() => reject(new Error('Timeout')), 5000)
        );
        
        const { data, error } = await Promise.race([promise, timeout]);
        
        if (error) throw error;
        
        if (data) {
            pillsDb = data.pills || 0;
            boostsDb = data.speed || 0;
            bestScore = data.score || 0;
            document.getElementById('pills-count').innerText = pillsDb;
            document.getElementById('boost-count').innerText = boostsDb;
            document.getElementById('best-score').innerText = bestScore;
            document.getElementById('menu-save-status').innerText = '✓ Синхронизировано';
        } else {
            document.getElementById('menu-save-status').innerText = '✓ Готов к игре';
        }
    } catch(e) {
        console.log('DB error (playing offline):', e.message);
        document.getElementById('menu-save-status').innerText = '⚠ Офлайн режим';
    }
}

async function quickSave() {
    try {
        const promise = _supabase.from('records').select('*').eq('username', playerName).single();
        const timeout = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Timeout')), 3000)
        );
        
        const { data } = await Promise.race([promise, timeout]);
        
        if (data) {
            await _supabase.from('records').update({ pills: pillsDb, speed: boostsDb }).eq('username', playerName);
        } else {
            await _supabase.from('records').insert([{ username: playerName, score: 0, pills: pillsDb, speed: boostsDb }]);
        }
    } catch(e) {
        console.log('Save failed:', e.message);
    }
}

async function saveProgress(s) {
    if (s > bestScore) bestScore = s;
    try {
        const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
        if (data) {
            await _supabase.from('records').update({ score: bestScore, pills: pillsDb, speed: boostsDb }).eq('username', playerName);
        } else {            await _supabase.from('records').insert([{ username: playerName, score: bestScore, pills: pillsDb, speed: boostsDb }]);
        }
        loadLeaderboard();
    } catch(e) {
        console.log('Progress save failed:', e.message);
    }
}

async function loadLeaderboard() {
    const list = document.getElementById('leader-list');
    list.innerHTML = 'Загрузка...';
    
    try {
        const promise = _supabase.from('records').select('*').order('score', { ascending: false }).limit(10);
        const timeout = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Timeout')), 5000)
        );
        
        const { data, error } = await Promise.race([promise, timeout]);
        
        if (error) throw error;
        
        if (data && data.length > 0) {
            list.innerHTML = data.map((p, i) => 
                `<div class="leader-item"${p.username===playerName?' style="color:#ff0"':''}>
                    <span>${i+1}. ${p.username.substring(0,12)}</span>
                    <span>${p.score} 💊${p.pills||0}</span>
                </div>`
            ).join('');
        } else {
            list.innerHTML = 'Пока пусто...';
        }
    } catch(e) {
        list.innerHTML = 'Не удалось загрузить';
    }
}

// Canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const groundY = canvas.height - (canvas.height / 3.5);

// Images
const imgs = {
    bg: new Image(), beer: new Image(), pills: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()], house: new Image()
};imgs.bg.src = 'bg.png'; imgs.beer.src = 'beer.png'; imgs.pills.src = 'pills.png';
imgs.jump.src = 'jump.png'; imgs.run[0].src = 'run_1.png'; imgs.run[1].src = 'run_2.png';
imgs.run[2].src = 'run_3.png'; imgs.house.src = 'house.png';

// Cutscenes
const slides = ['end_1.jpg','end_2.jpg','end_3.jpg','end_4.jpg','end_5.jpg'];
const phrases = ["АНДЕГРАУНД ПАЛЮБОМУ","ЧИЛАНЗАРСКИЕ ДВОРИКИ ЖДУТ","ТЫ ЖЕ ПИТЬ БРОСИЛА","КИБРАЙ ОКАЗАЛСЯ СИЛЬНЕЕ","ЭТО ТЕБЕ НЕ ВПИСКА"];
let currentSlide = 0;

// Player
const player = { x: 50, y: groundY - 110, w: 90, h: 110, dy: 0, jf: 17.5, g: 0.75, grounded: false, frame: 0, tick: 0 };
let obstacles = [], collectables = [], particles = [], screenShake = 0;

// Buy boost
function buyBoost() {
    const btn = document.getElementById('buy-btn');
    if (pillsDb >= 10) {
        pillsDb -= 10; boostsDb += 1;
        document.getElementById('pills-count').innerText = pillsDb;
        document.getElementById('boost-count').innerText = boostsDb;
        haptic('success'); quickSave();
        btn.innerText = 'КУПЛЕНО!';
        setTimeout(() => btn.innerText = 'КУПИТЬ (10💊)', 1000);
    } else {
        haptic('error');
        btn.innerText = 'МАЛО 💊!';
        btn.style.background = '#f44';
        setTimeout(() => { btn.innerText = 'КУПИТЬ (10💊)'; btn.style.background = '#0ff'; }, 1000);
    }
}

// Activate boost
function activateBoost() {
    if (boostsDb > 0 && !isBoostActive && gameState === 'PLAYING' && !isPaused) {
        boostsDb--; isBoostActive = true; boostFrames = 300;
        document.getElementById('boost-count').innerText = boostsDb;
        haptic('heavy'); quickSave();
    }
}

// Start game
function startGame(mode) {
    gameMode = mode; gameState = 'PLAYING'; isPaused = false; score = 0; houseX = -5000;
    obstacles = []; collectables = []; particles = []; isBoostActive = false; boostFrames = 0;
    player.y = groundY - player.h; player.dy = 0; player.grounded = true;
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('death-screen').style.display = 'none';
    document.getElementById('pause-screen').style.display = 'none';
    document.getElementById('ui').style.display = 'flex';    document.getElementById('pause-btn').style.display = 'flex';
    document.getElementById('score').innerText = '0';
    
    try { tg.BackButton.show(); tg.BackButton.onClick(() => togglePause()); } catch(e) {}
    haptic('light');
}

// Pause
function togglePause() {
    if (gameState !== 'PLAYING') return;
    isPaused = !isPaused;
    document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
    if (!isPaused) { try { tg.BackButton.show(); } catch(e) {} }
}

// Return to menu
function returnToMenu() {
    gameState = 'MENU';
    document.getElementById('death-screen').style.display = 'none';
    document.getElementById('pause-screen').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    document.getElementById('pause-btn').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    try { tg.BackButton.hide(); } catch(e) {}
    loadLeaderboard();
    fetchUserData();
}

// Update
function update() {
    if (gameState !== 'PLAYING' || isPaused) return;
    
    const speed = isBoostActive ? gameSpeed * 3 : gameSpeed;
    
    if (isBoostActive) {
        boostFrames--;
        if (boostFrames <= 0) { isBoostActive = false; canvas.style.filter = 'none'; }
        else canvas.style.filter = `hue-rotate(${boostFrames*8}deg) saturate(2)`;
    }
    
    player.dy += player.g;
    player.y += player.dy;
    if (player.y + player.h > groundY) { player.y = groundY - player.h; player.dy = 0; player.grounded = true; }
    else player.grounded = false;
    
    if (player.grounded) { player.tick++; if (player.tick % 7 === 0) player.frame = (player.frame + 1) % 3; }
    
    if (gameMode === 'STORY' && score >= 28 && houseX < -1000) houseX = canvas.width;
    if (houseX > -1000) {
        houseX -= speed;        if (player.x + player.w > houseX + 100) {
            gameState = 'CUT';
            canvas.style.filter = 'brightness(0)';
            setTimeout(startCutscene, 2000);
        }
    }
    
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        const o = obstacles[i];
        
        if (!isBoostActive && player.x + 35 < o.x + o.w && player.x + player.w - 35 > o.x && 
            player.y + 10 < o.y + o.h && player.y + player.h > o.y + 10) {
            gameState = 'DEAD';
            screenShake = 20;
            haptic('heavy');
            if (gameMode === 'FREE') saveProgress(score);
            document.getElementById('death-msg').innerText = phrases[Math.floor(Math.random() * phrases.length)];
            document.getElementById('final-score').innerText = score;
            canvas.style.filter = 'none';
            document.getElementById('ui').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('death-screen').style.display = 'flex';
            try { tg.BackButton.hide(); } catch(e) {}
        }
        
        if (o.x + o.w < 0) { obstacles.splice(i, 1); score++; document.getElementById('score').innerText = score; }
    }
    
    for (let i = collectables.length - 1; i >= 0; i--) {
        collectables[i].x -= speed;
        const c = collectables[i];
        
        if (player.x < c.x + c.w && player.x + player.w > c.x && player.y < c.y + c.h && player.y + player.h > c.y) {
            pillsDb++;
            document.getElementById('pills-count').innerText = pillsDb;
            createParticles(c.x + c.w/2, c.y + c.h/2, 8, '#ff0');
            haptic('light');
            collectables.splice(i, 1);
        } else if (c.x + c.w < 0) {
            collectables.splice(i, 1);
        }
    }
    
    if (Math.random() < 0.04 && (gameMode === 'FREE' || score < 28) && 
        (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 300)) {
        obstacles.push({ x: canvas.width, y: groundY - 75, w: 45, h: 75 });
    }
    if (Math.random() < 0.015 && collectables.length === 0) {
        collectables.push({ x: canvas.width, y: groundY - 140, w: 40, h: 40 });    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    if (screenShake > 0) {
        screenShake--;
        canvas.style.transform = `translate(${(Math.random()-0.5)*screenShake}px, ${(Math.random()-0.5)*screenShake}px)`;
    } else {
        canvas.style.transform = 'none';
    }
}

// Draw
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (imgs.bg.complete) ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    else { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    
    if (gameState === 'PLAYING' || gameState === 'CUT') {
        if (houseX > -1000 && imgs.house.complete) {
            ctx.drawImage(imgs.house, houseX, groundY - 320, 320, 320);
        }
        
        obstacles.forEach(o => {
            if (imgs.beer.complete) ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h);
            else { ctx.fillStyle = '#f60'; ctx.fillRect(o.x, o.y, o.w, o.h); }
        });
        
        collectables.forEach(c => {
            if (imgs.pills.complete) ctx.drawImage(imgs.pills, c.x, c.y, c.w, c.h);
            else { ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h/2, c.w/2, 0, Math.PI*2); ctx.fill(); }
        });
        
        const cur = player.grounded ? imgs.run[player.frame] : imgs.jump;
        if (cur?.complete) ctx.drawImage(cur, player.x, player.y, player.w, player.h);
        else { ctx.fillStyle = isBoostActive ? '#0ff' : '#f0f'; ctx.fillRect(player.x, player.y, player.w, player.h); }
        
        particles.forEach(p => {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });        ctx.globalAlpha = 1;
    }
    
    requestAnimationFrame(draw);
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 30 + Math.random() * 20,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

function startCutscene() {
    document.getElementById('cutscene').style.display = 'flex';
    currentSlide = 0;
    showSlide();
}

function showSlide() {
    const img = document.getElementById('cutscene-img');
    const btn = document.getElementById('next-btn');
    
    if (currentSlide < slides.length) {
        img.src = slides[currentSlide];
        btn.style.display = 'block';
    } else {
        btn.style.display = 'none';
        setTimeout(() => location.reload(), 2000);
    }
}

document.getElementById('next-btn').onclick = () => { currentSlide++; showSlide(); };

function jump(e) {
    if (gameState === 'PLAYING' && !isPaused && player.grounded && e.target.tagName !== 'BUTTON') {
        player.dy = -player.jf;
        player.grounded = false;
        haptic('medium');
    }
}
window.addEventListener('touchstart', jump);
window.addEventListener('mousedown', jump);
window.addEventListener('keydown', (e) => {    if (e.code === 'Space' || e.code === 'ArrowUp') jump(e);
    if (e.code === 'Escape') togglePause();
});

// Init - загружаем данные, но не ждём вечно
fetchUserData();
loadLeaderboard();
setInterval(update, 1000/60);
draw();
</script>
</body>
</html>
