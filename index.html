ю<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ксюшачка^</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: 'Courier New', monospace;
    overflow: hidden;
}

/* 👇 ВАЖНО — canvas не блокирует клики */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
    pointer-events: none;
}

/* 👇 ФИКС КЛИКОВ */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.overlay * {
    pointer-events: auto;
}

/* ===== МЕНЮ ===== */
#menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a001a, #000);
    z-index: 100;
}

h1 {
    font-size: 48px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px #ff00ff;
    background: linear-gradient(to right, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow-text 3s linear infinite, float 3s ease-in-out infinite;
}

@keyframes rainbow-text { to { background-position: 200% center; } }

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

/* Кнопки */
.menu-btn {
    background: linear-gradient(145deg, #ff00ff, #b300b3);
    border: none;
    padding: 16px;
    width: 260px;
    margin: 10px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    color: white;
    transition: 0.2s;
    box-shadow: 0 8px 20px rgba(255,0,255,0.4);
}

.menu-btn:active {
    transform: scale(0.95);
}

.btn-free {
    background: linear-gradient(145deg, #00ffff, #009999);
    color: #000;
}

.btn-shop {
    background: linear-gradient(145deg, #ffff00, #b3b300);
    color: #000;
}

/* Лидерборд */
#leaderboard {
    margin-top: 25px;
    width: 85%;
    max-width: 320px;
    background: rgba(255,0,255,0.08);
    border: 1px solid rgba(255,0,255,0.4);
    border-radius: 14px;
    padding: 12px;
}

.leader-item {
    display: flex;
    justify-content: space-between;
    padding: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* UI */
#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 100;
    display: none;
}

/* BOOST */
#boost-control {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: none;
}

.btn-boost-active {
    width: 70px;
    height: 70px;
    border-radius: 50%;
}
</style>
</head>

<body>

<div id="menu" class="overlay">
    <h1>КСЮШАЧКА^</h1>

    <button class="menu-btn" onclick="startGame('STORY')">🎬 СЮЖЕТ</button>
    <button class="menu-btn btn-free" onclick="startGame('FREE')">🏃 СВОБОДНЫЙ</button>
    <button class="menu-btn btn-shop" onclick="toggleShop(true)">🛒 МАГАЗИН</button>

    <div id="leaderboard">
        <div id="leader-list">Загрузка...</div>
    </div>
</div>

<div id="ui">
    SCORE: <span id="score">0</span> | 💊 <span id="pills-count">0</span>
</div>

<div id="boost-control">
    <button class="btn-boost-active" onclick="activateBoost()">🚀 <span id="boost-count-ui">0</span></button>
</div>

<canvas id="game"></canvas>

<script>
const SUPABASE_URL = 'https://rfjruwbeiaahegzmowcc.supabase.co';
const SUPABASE_KEY = 'ТВОЙ_КЛЮЧ_СЮДА';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const tg = window.Telegram.WebApp;
const playerName = tg.initDataUnsafe?.user?.username || "Player";

async function loadLeaderboard() {
    const list = document.getElementById('leader-list');
    list.style.opacity = 0;

    const { data } = await _supabase
        .from('records')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);

    if (data) {
        setTimeout(() => {
            list.innerHTML =
                `<div style="color:#00ffff;">ТОП:</div>` +
                data.map((p, i) =>
                    `<div class="leader-item">
                        <span>${i+1}. ${p.username}</span>
                        <span>${p.score}</span>
                    </div>`
                ).join('');
            list.style.opacity = 1;
        }, 200);
    }
}

loadLeaderboard();

/* Игра */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

function startGame() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
}

function toggleShop() {
    alert("магазин потом 😎");
}

function activateBoost() {
    alert("БУСТ 🚀");
}

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
