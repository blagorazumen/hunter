<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUNTER • MENU</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --ivory: #fdf5e6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: var(--ivory); 
            font-family: 'Times New Roman', serif; font-style: italic;
            overflow: hidden;
        }

        /* Твой фон */
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.jpg') center center / cover no-repeat;
            filter: grayscale(100%) brightness(0.2) contrast(1.1);
            z-index: 1;
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 100%);
            z-index: 2;
        }

        /* Центрированное меню */
        .menu-layer {
            position: relative; z-index: 10;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px;
        }

        .title-section { text-align: center; margin-bottom: 60px; }
        .title-section h1 { 
            font-size: 28px; letter-spacing: 10px; text-transform: uppercase; 
            margin: 0; opacity: 0.9; font-weight: 300;
        }
        .title-section span { font-size: 10px; letter-spacing: 4px; opacity: 0.4; text-transform: uppercase; }

        .nav-buttons { width: 100%; max-width: 250px; }

        .menu-btn {
            background: transparent; border: none;
            color: var(--ivory); padding: 15px; width: 100%;
            margin-bottom: 10px; text-transform: uppercase;
            letter-spacing: 4px; font-size: 12px; cursor: pointer;
            transition: 0.5s; opacity: 0.6;
            border-bottom: 0.5px solid rgba(253, 245, 230, 0);
        }
        
        /* Эффект при нажатии */
        .menu-btn:active { opacity: 1; border-bottom: 0.5px solid var(--ivory); transform: scale(1.05); }

        .footer-info { position: absolute; bottom: 20px; font-size: 9px; opacity: 0.3; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="vignette"></div>

    <div class="menu-layer">
        <div class="title-section">
            <h1>HUNTER</h1>
            <span>The Dark Plains of Trilliant</span>
        </div>

        <div class="nav-buttons">
            <button class="menu-btn" onclick="startGame()">Начать путь</button>
            <button class="menu-btn" onclick="showHero()">Персонаж</button>
            <button class="menu-btn" onclick="tgClose()">Покинуть земли</button>
        </div>

        <div class="footer-info">ALPHA VERSION • 2026</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000';

        function startGame() {
            tg.HapticFeedback.impactOccurred('medium');
            // Позже мы пропишем переход к первой сцене
            alert("Путь начинается..."); 
        }

        function showHero() {
            tg.HapticFeedback.selectionChanged();
            alert("Никита • Уровень 1 • Кинжал Триллианта");
        }

        function tgClose() {
            tg.close();
        }
    </script>
</body>
</html>
