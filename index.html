<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Altushka Run: Tashkent Underground</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; background: #000; position: fixed; top: 0; left: 0; z-index: 1; }
        
        #ui, #msg, #menu { 
            position: absolute; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            z-index: 100; /* Поднимаем интерфейс над игрой */
            pointer-events: none; /* Пропускаем нажатия сквозь пустые места */
        }

        #ui { top: 20px; font-size: 24px; text-shadow: 2px 2px #000; display: none; color: #ff00ff; }
        
        #menu { top: 50%; transform: translateY(-50%); display: block; pointer-events: auto; }
        #menu h1 { color: #ff00ff; font-size: 38px; margin-bottom: 5px; text-shadow: 3px 3px #000; }
        #best { font-size: 18px; margin-bottom: 30px; color: #00ff00; }
        
        #msg { top: 40%; transform: translateY(-50%); display: none; background: rgba(0,0,0,0.85); padding: 30px 0; pointer-events: auto; }
        #msg h1 { color: #ff0000; font-size: 36px; text-shadow: 2px 2px #000; margin-bottom: 10px; }
        #death-text { font-size: 18px; margin-bottom: 25px; padding: 0 15px; color: #ccc; }
        
        button { 
            background: #ff00ff; 
            border: none; 
            padding: 18px 50px; 
            color: white; 
            font-size: 22px; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 6px #990099; 
            text-transform: uppercase; 
            font-weight: bold;
            pointer-events: auto; /* Кнопка должна ловить нажатия */
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: translateY(3px); box-shadow: 0 2px #990099; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    
    <div id="menu">
        <h1>ALTUSHKA RUN</h1>
        <div id="best">BEST: 0</div>
        <button id="start-btn">ИГРАТЬ</button>
    </div>

    <div id="msg">
        <h1>ПОТРАЧЕНО</h1>
        <div id="death-text">Кибрай оказался сильнее...</div>
        <button id="retry-btn">ЕЩЕ РАЗ</button>
    </div>

    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const bestElement = document.getElementById('best');
const deathText = document.getElementById('death-text');

const phrases = [
    "Кибрай оказался сильнее...",
    "Альтушка ушла в андеграунд окончательно",
    "Пойдем лучше за куртом, ну его этот бег",
    "Баклажка тебя переиграла",
    "Минус кеды, плюс грусть",
    "Слишком много Чилланзара для одной прогулки",
    "Телебашня смотрит на тебя с осуждением",
    "Бутылка: 1, Альтушка: 0"
];

const imgs = {
    bg: new Image(), beer: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()]
};

imgs.bg.src = 'bg.png';
imgs.beer.src = 'beer.png';
imgs.jump.src = 'jump.png';
imgs.run[0].src = 'run_1.png';
imgs.run[1].src = 'run_2.png';
imgs.run[2].src = 'run_3.png';

let gameState = 'MENU';
let score = 0;
let bestScore = localStorage.getItem('altushkaBest') || 0;
bestElement.innerText = `BEST: ${bestScore}`;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height - (canvas.height / 3.5);
let gameSpeed = 6;
let bgX = 0;

const player = {
    x: 50, y: groundY - 110, w: 90, h: 110,
    dy: 0, jumpForce: 16, gravity: 0.8, grounded: false,
    frame: 0, animTick: 0
};

let obstacles = [];

function spawnObstacle() {
    obstacles.push({ x: canvas.width, y: groundY - 70, w: 40, h: 70 });
}

function update() {
    if (gameState !== 'PLAYING') return;

    bgX -= 1.8;
    if (bgX <= -canvas.width) bgX = 0;

    player.dy += player.gravity;
    player.y += player.dy;
    
    if (player.y + player.h > groundY) {
        player.y = groundY - player.h;
        player.dy = 0;
        player.grounded = true;
    }

    if (player.grounded) {
        player.animTick++;
        if (player.animTick % 7 === 0) player.frame = (player.frame + 1) % 3;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        
        if (player.x + 25 < obstacles[i].x + obstacles[i].w &&
            player.x + player.w - 25 > obstacles[i].x &&
            player.y + 15 < obstacles[i].y + obstacles[i].h &&
            player.y + player.h > obstacles[i].y) {
            gameOver();
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
            score++;
            scoreElement.innerText = score;
            if (score % 6 === 0) gameSpeed += 0.4;
        }
    }

    if (Math.random() < 0.018 && (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 320)) {
        spawnObstacle();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, bgX, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, bgX + canvas.width, 0, canvas.width, canvas.height);

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        const currentImg = player.grounded ? imgs.run[player.frame] : imgs.jump;
        ctx.drawImage(currentImg, player.x, player.y, player.w, player.h);
        obstacles.forEach(o => ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h));
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function startGame() {
    gameState = 'PLAYING';
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('msg').style.display = 'block';
    deathText.innerText = phrases[Math.floor(Math.random() * phrases.length)];
    
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('altushkaBest', bestScore);
        bestElement.innerText = `BEST: ${bestScore}`;
    }
}

function resetGame() {
    score = 0; scoreElement.innerText = '0';
    gameSpeed = 6; obstacles = [];
    player.y = groundY - 110;
    gameState = 'PLAYING';
    document.getElementById('msg').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
}

// Привязываем кнопки жестко
document.getElementById('start-btn').onclick = (e) => { e.stopPropagation(); startGame(); };
document.getElementById('retry-btn').onclick = (e) => { e.stopPropagation(); resetGame(); };

// Управление тапом по канвасу (прыжок)
window.addEventListener('touchstart', (e) => {
    if (gameState === 'PLAYING') {
        if (player.grounded) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        }
    }
}, { passive: false });

loop();
</script>
</body>
</html>
