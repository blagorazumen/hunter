<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Altushka Run: Tashkent Underground</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; background: #000; }
        #ui, #msg, #menu { position: absolute; left: 0; width: 100%; text-align: center; z-index: 10; }
        #ui { top: 20px; font-size: 24px; text-shadow: 2px 2px #000; display: none; color: #ff00ff; }
        
        #menu { top: 50%; transform: translateY(-50%); }
        #menu h1 { color: #ff00ff; font-size: 42px; margin-bottom: 5px; text-shadow: 3px 3px #000; }
        #best { font-size: 18px; margin-bottom: 30px; color: #00ff00; }
        
        #msg { top: 40%; transform: translateY(-50%); display: none; background: rgba(0,0,0,0.8); padding: 20px 0; }
        #msg h1 { color: #ff0000; font-size: 40px; text-shadow: 2px 2px #000; margin-bottom: 10px; }
        #death-text { font-size: 18px; margin-bottom: 25px; padding: 0 10px; color: #ccc; }
        
        button { background: #ff00ff; border: none; padding: 15px 45px; color: white; font-size: 20px; border-radius: 8px; cursor: pointer; box-shadow: 0 5px #990099; text-transform: uppercase; font-weight: bold; }
        button:active { transform: translateY(3px); box-shadow: 0 2px #990099; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    
    <div id="menu">
        <h1>ALTUSHKA RUN</h1>
        <div id="best">BEST: 0</div>
        <button onclick="startGame()">ИГРАТЬ</button>
    </div>

    <div id="msg">
        <h1>ПОТРАЧЕНО</h1>
        <div id="death-text">Бутылка оказалась сильнее...</div>
        <button onclick="resetGame()">ЕЩЕ РАЗ</button>
    </div>

    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const bestElement = document.getElementById('best');
const deathText = document.getElementById('death-text');

// Список смешных концовок
const phrases = [
    "Кибрай оказался сильнее...",
    "Альтушка ушла в андеграунд окончательно",
    "Пойдем лучше за куртом, ну его этот бег",
    "Баклажка тебя переиграла",
    "Минус кеды, плюс грусть",
    "Слишком много Чилланзара для одной прогулки",
    "Телебашня смотрит на тебя с осуждением",
    "В следующий раз перепрыгнешь (нет)",
    "Бутылка: 1, Альтушка: 0"
];

const imgs = {
    bg: new Image(), beer: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()]
};

// Загрузка ресурсов
imgs.bg.src = 'bg.png';
imgs.beer.src = 'beer.png';
imgs.jump.src = 'jump.png';
imgs.run[0].src = 'run_1.png';
imgs.run[1].src = 'run_2.png';
imgs.run[2].src = 'run_3.png';

let gameState = 'MENU';
let score = 0;
let bestScore = localStorage.getItem('altushkaBest') || 0;
bestElement.innerText = `BEST: ${bestScore}`;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundY = canvas.height - (canvas.height / 3.5);
let gameSpeed = 6;
let bgX = 0;

const player = {
    x: 50, y: groundY - 110, w: 90, h: 110,
    dy: 0, jumpForce: 16, gravity: 0.8, grounded: false,
    frame: 0, animTick: 0
};

let obstacles = [];

function spawnObstacle() {
    obstacles.push({ x: canvas.width, y: groundY - 65, w: 35, h: 65 });
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Параллакс фона
    bgX -= 1.5;
    if (bgX <= -canvas.width) bgX = 0;

    // Физика игрока
    player.dy += player.gravity;
    player.y += player.dy;
    
    if (player.y + player.h > groundY) {
        player.y = groundY - player.h;
        player.dy = 0;
        player.grounded = true;
    }

    // Анимация бега
    if (player.grounded) {
        player.animTick++;
        if (player.animTick % 7 === 0) player.frame = (player.frame + 1) % 3;
    }

    // Препятствия
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        
        // Хитбокс (чуть сужен для комфортной игры)
        if (player.x + 20 < obstacles[i].x + obstacles[i].w &&
            player.x + player.w - 20 > obstacles[i].x &&
            player.y + 15 < obstacles[i].y + obstacles[i].h &&
            player.y + player.h > obstacles[i].y) {
            gameOver();
        }

        if (obstacles[i].x + obstacles[i].w < 0) {
            obstacles.splice(i, 1);
            score++;
            scoreElement.innerText = score;
            if (score % 6 === 0) gameSpeed += 0.4;
        }
    }

    if (Math.random() < 0.018 && (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 320)) {
        spawnObstacle();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Отрисовка зацикленного фона
    ctx.drawImage(imgs.bg, bgX, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, bgX + canvas.width, 0, canvas.width, canvas.height);

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // Игрок (спрайт меняется при прыжке)
        const currentImg = player.grounded ? imgs.run[player.frame] : imgs.jump;
        if (currentImg.complete) {
            ctx.drawImage(currentImg, player.x, player.y, player.w, player.h);
        }

        // Бутылки Кибрая
        if (imgs.beer.complete) {
            obstacles.forEach(o => ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h));
        }
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function startGame() {
    gameState = 'PLAYING';
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('msg').style.display = 'block';
    // Выбираем случайную фразу
    deathText.innerText = phrases[Math.floor(Math.random() * phrases.length)];
    
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('altushkaBest', bestScore);
        bestElement.innerText = `BEST: ${bestScore}`;
    }
}

function resetGame() {
    score = 0; scoreElement.innerText = '0';
    gameSpeed = 6; obstacles = [];
    player.y = groundY - 110;
    gameState = 'PLAYING';
    document.getElementById('msg').style.display = 'none';
}

// Управление тапом
window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING' && player.grounded) {
        player.dy = -player.jumpForce;
        player.grounded = false;
    }
}, { passive: false });

// Поддержка пробела для ПК
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (gameState === 'PLAYING') {
            if (player.grounded) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            }
        } else if (gameState === 'MENU') startGame();
        else if (gameState === 'GAMEOVER') resetGame();
    }
});

// Запуск после загрузки фона
imgs.bg.onload = () => loop();
</script>
</body>
</html>
