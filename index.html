<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAVE CONTROL • ORG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        :root { --bg: #000; --accent: #ff00ff; --text: #fff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; filter: invert(100%) hue-rotate(300deg) brightness(1.1) contrast(1.4); }
        
        .ui-layer { position: relative; z-index: 100; pointer-events: none; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .header { padding: 15px; background: rgba(0,0,0,0.9); text-align: center; pointer-events: auto; border-bottom: 2px solid var(--accent); }
        .status { font-size: 14px; color: var(--accent); font-weight: bold; text-shadow: 0 0 10px var(--accent); }
        
        .hint-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(255,0,255,0.2); border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 10px; pointer-events: none; text-transform: uppercase; }

        #submit-modal { 
            position: fixed; bottom: -100%; left: 0; width: 100%; background: #080808; 
            border-top: 3px solid var(--accent); transition: 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1); z-index: 200; pointer-events: auto;
            padding: 20px; box-sizing: border-box;
        }
        #submit-modal.open { bottom: 0; }
        input, textarea { width: 100%; background: #151515; border: 1px solid #333; color: #fff; padding: 12px; margin: 8px 0; font-family: inherit; border-radius: 5px; }
        input:focus { border-color: var(--accent); outline: none; }
        .btn-send { background: var(--accent); color: #000; border: none; width: 100%; padding: 15px; font-weight: bold; text-transform: uppercase; margin-top: 10px; box-shadow: 0 0 20px rgba(255,0,255,0.4); }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ui-layer">
        <div class="header">
            <div class="status">GATEKEEPER • ORG_TERMINAL</div>
        </div>
        <div class="hint-box">Ткни в карту, чтобы выбрать место</div>
    </div>

    <div id="submit-modal">
        <div style="color:var(--accent); font-size: 12px; margin-bottom: 10px;">> LOCATION_LOCKED: <span id="coords-display">0.0, 0.0</span></div>
        <input type="text" id="raveName" placeholder="НАЗВАНИЕ ИВЕНТА">
        <input type="text" id="raveTime" placeholder="ДАТА И ВРЕМЯ">
        <textarea id="raveDesc" rows="3" placeholder="ОПИСАНИЕ / LINE-UP / ПРАЙС"></textarea>
        <button class="btn-send" onclick="sendData()">ОТПРАВИТЬ НА МОДЕРАЦИЮ</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#555; width:100%; margin-top:10px; font-size:10px;">[ ОТМЕНА ]</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let selectedCoords = null;
        let tempPlacemark = null;

        tg.expand();
        tg.headerColor = '#000000';

        ymaps.ready(init);
        function init() {
            var myMap = new ymaps.Map("map", {
                center: [41.311, 69.240], zoom: 12, controls: []
            });

            myMap.events.add('click', function (e) {
                selectedCoords = e.get('coords');
                document.getElementById('coords-display').innerText = selectedCoords[0].toFixed(4) + ", " + selectedCoords[1].toFixed(4);
                
                if (tempPlacemark) {
                    tempPlacemark.geometry.setCoordinates(selectedCoords);
                } else {
                    tempPlacemark = new ymaps.Placemark(selectedCoords, {}, {
                        preset: 'islands#pinkCircleDotIcon',
                        draggable: true
                    });
                    myMap.geoObjects.add(tempPlacemark);
                }
                
                tg.HapticFeedback.impactOccurred('medium');
                document.getElementById('submit-modal').classList.add('open');
            });
        }

        function closeModal() {
            document.getElementById('submit-modal').classList.remove('open');
        }

        function sendData() {
            const data = {
                name: document.getElementById('raveName').value,
                time: document.getElementById('raveTime').value,
                desc: document.getElementById('raveDesc').value,
                coords: selectedCoords
            };

            if (!data.name || !selectedCoords) {
                tg.showAlert("Выбери место на карте и введи название!");
                return;
            }

            const message = `⚡️ НОВЫЙ ИВЕНТ!\n\n📛: ${data.name}\n📅: ${data.time}\n📍: ${data.coords[0]}, ${data.coords[1]}\n📝: ${data.desc}`;
            tg.sendData(message);
            tg.close();
        }
    </script>
</body>
</html>
