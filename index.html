<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GATEKEEPER • ORG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        /* Стиль: Молочный курсив */
        :root { --bg: #000; --accent: #fdf5e6; --text: #fdf5e6; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-style: italic; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000 !important; color: var(--text); font-family: 'Georgia', serif; overflow: hidden; }
        
        #preloader { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader-text { color: var(--accent); letter-spacing: 3px; animation: pulse 2s infinite; font-size: 14px; }

        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease; filter: invert(100%) sepia(10%) hue-rotate(320deg) brightness(0.9) contrast(1.1); }
        
        .ui-layer { position: relative; z-index: 100; pointer-events: none; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .header { padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); text-align: center; pointer-events: auto; border-bottom: 0.5px solid rgba(253, 245, 230, 0.3); }
        
        #submit-modal { 
            position: fixed; bottom: -100%; left: 0; width: 100%; background: #0a0a0a; 
            border-top: 1px solid var(--accent); transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 200; pointer-events: auto; padding: 25px;
        }
        #submit-modal.open { bottom: 0; }
        input, textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(253, 245, 230, 0.2); color: #fff; padding: 12px 0; margin: 10px 0; font-family: inherit; font-size: 16px; }
        input:focus { border-bottom-color: var(--accent); outline: none; }
        
        .btn-send { background: var(--accent); color: #000; border: none; width: 100%; padding: 16px; font-weight: bold; text-transform: uppercase; margin-top: 20px; letter-spacing: 1px; }

        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 0.8; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div id="preloader"><div class="loader-text"><i>Initializing terminal...</i></div></div>
    <div id="map"></div>
    <div class="ui-layer">
        <div class="header"><div style="color:var(--accent); font-size:13px; letter-spacing: 2px;"><i>GATEKEEPER • ORG_TERMINAL</i></div></div>
    </div>

    <div id="submit-modal">
        <div style="color:var(--accent); font-size: 11px; margin-bottom: 10px; opacity: 0.7;"><i>Location coordinates: <span id="coords-display">0.0, 0.0</span></i></div>
        <input type="text" id="raveName" placeholder="Event name...">
        <input type="text" id="raveTime" placeholder="Date & Time...">
        <textarea id="raveDesc" rows="3" placeholder="Description & Line-up..."></textarea>
        <button class="btn-send" onclick="sendData()">Confirm submission</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#666; width:100%; margin-top:15px; font-size:12px;"><i>[ Dismiss ]</i></button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let selectedCoords = null;
        tg.expand();

        ymaps.ready(function() {
            var myMap = new ymaps.Map("map", { center: [41.311, 69.240], zoom: 12, controls: [] });
            document.getElementById('map').style.opacity = "1";
            document.getElementById('preloader').style.opacity = "0";
            setTimeout(() => { document.getElementById('preloader').style.display = "none"; }, 600);

            myMap.events.add('click', function (e) {
                selectedCoords = e.get('coords');
                document.getElementById('coords-display').innerText = selectedCoords[0].toFixed(4) + ", " + selectedCoords[1].toFixed(4);
                tg.HapticFeedback.impactOccurred('light');
                document.getElementById('submit-modal').classList.add('open');
            });
        });

        function closeModal() { document.getElementById('submit-modal').classList.remove('open'); }

        function sendData() {
            const data = {
                name: document.getElementById('raveName').value,
                time: document.getElementById('raveTime').value,
                desc: document.getElementById('raveDesc').value,
                coords: selectedCoords
            };
            if (!data.name || !selectedCoords) { tg.showAlert("Please select a location."); return; }
            tg.sendData(`✨ NEW SUBMISSION:\nName: ${data.name}\nTime: ${data.time}\nCoords: ${data.coords}\nInfo: ${data.desc}`);
            tg.close();
        }
    </script>
</body>
</html>
