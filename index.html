<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC HUNTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance"><span id="cash-display">0</span> СУМ</div>
            <div class="income-info" id="income-display">Доход: 0 / сек</div>
        </div>

        <div class="char-container">ФУНДАМЕНТ ЗАЛОЖЕН</div>

        <div class="click-section">
            <button class="main-btn" onclick="doSueta()">СУЕТИТЬ</button>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="openTab('assets')">ИМУЩЕСТВО</button>
            <button class="nav-item active" onclick="openTab('shop')">МАГАЗИН</button>
            <button class="nav-item" onclick="openTab('leaderboard')">КОД</button>
        </div>
    </div>

    <div id="main-overlay" class="overlay">
        <div class="overlay-header">
            <button class="static-back-btn" onclick="goBack()">← НАЗАД</button>
            <div class="overlay-balance"><span id="overlay-cash">0</span> СУМ</div>
        </div>
        <div id="main-content" class="overlay-content"></div>
    </div>

    <script src="database.js"></script>
    <script src="logic.js"></script>
</body>
</html>
