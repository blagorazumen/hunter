<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Altushka Run: Ksenia</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Courier New', monospace; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        #ui, #menu, #cutscene { position: absolute; left: 0; width: 100%; height: 100%; text-align: center; z-index: 100; pointer-events: none; }
        #ui { top: 20px; height: auto; font-size: 28px; display: none; color: #ff00ff; text-shadow: 2px 2px #000; }
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0,0,0,0.6); }
        #menu h1 { color: #ff00ff; font-size: 42px; text-shadow: 3px 3px #000; margin-bottom: 30px; }
        #cutscene { display: none; background: #000; pointer-events: auto; }
        #cutscene img { max-width: 100%; max-height: 100%; object-fit: contain; }
        button { background: #ff00ff; border: none; padding: 20px 60px; color: white; font-size: 24px; border-radius: 12px; cursor: pointer; box-shadow: 0 6px #990099; font-weight: bold; pointer-events: auto; }
        button:active { transform: translateY(3px); box-shadow: 0 2px #990099; }
        .trippy { animation: hue 0.5s infinite linear; }
        @keyframes hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="menu">
        <h1>ALTUSHKA RUN</h1>
        <button id="start-btn">ИГРАТЬ</button>
    </div>
    <div id="cutscene">
        <img id="cutscene-img" src="">
        <div style="position:absolute; bottom:40px; width:100%;"><button id="next-btn">ДАЛЕЕ</button></div>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const cutsceneDiv = document.getElementById('cutscene');
const cutsceneImg = document.getElementById('cutscene-img');
const scoreSpan = document.getElementById('score');

const imgs = {
    bg: new Image(), beer: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()],
    pill: new Image(), house: new Image()
};
imgs.bg.src = 'bg.png'; imgs.beer.src = 'beer.png'; imgs.jump.src = 'jump.png';
imgs.run[0].src = 'run_1.png'; imgs.run[1].src = 'run_2.png'; imgs.run[2].src = 'run_3.png';
imgs.pill.src = 'pill.png'; imgs.house.src = 'house.png';

const slides = ['end_1.jpg', 'end_2.jpg', 'end_3.jpg', 'end_4.jpg', 'end_5.jpg'];
let currentSlide = 0;
let gameState = 'MENU';
let score = 0;
let gameSpeed = 6;
let isSuper = false;
let houseX = -5000;

canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const groundY = canvas.height - (canvas.height / 3.5);

const player = { x: 50, y: groundY - 110, w: 90, h: 110, dy: 0, jf: 16, g: 0.8, grounded: false, frame: 0, tick: 0 };
let obstacles = [];

function spawn(type) {
    let size = type === 'beer' ? {w: 45, h: 75} : {w: 50, h: 50};
    obstacles.push({ x: canvas.width, y: groundY - size.h, w: size.w, h: size.h, type: type });
}

function update() {
    if (gameState !== 'PLAYING') return;

    player.dy += player.g;
    player.y += player.dy;
    if (player.y + player.h > groundY) { player.y = groundY - player.h; player.dy = 0; player.grounded = true; }
    if (player.grounded) { player.tick++; if (player.tick % 7 === 0) player.frame = (player.frame + 1) % 3; }

    if (score >= 28 && houseX < -1000) houseX = canvas.width;
    if (houseX > -1000) {
        houseX -= gameSpeed;
        if (player.x + player.w > houseX + 120) { gameState = 'CUT'; startCutscene(); }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        let o = obstacles[i];
        if (player.x < o.x + o.w - 10 && player.x + player.w > o.x + 10 && player.y < o.y + o.h && player.y + player.h > o.y) {
            if (o.type === 'pill') {
                isSuper = true; gameSpeed = 11; player.jf = 25; document.body.classList.add('trippy');
                setTimeout(() => { isSuper = false; gameSpeed = 6; player.jf = 16; document.body.classList.remove('trippy'); }, 3000);
                obstacles.splice(i, 1);
            } else if (!isSuper) { location.reload(); }
        }
        if (o.x + o.w < 0) { obstacles.splice(i, 1); score++; scoreSpan.innerText = score; }
    }

    if (score < 28 && Math.random() < 0.02 && (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 350)) {
        spawn(Math.random() < 0.88 ? 'beer' : 'pill');
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    if (gameState === 'PLAYING') {
        if (houseX > -1000) ctx.drawImage(imgs.house, houseX, groundY - 320, 320, 320);
        obstacles.forEach(o => ctx.drawImage(imgs[o.type], o.x, o.y, o.w, o.h));
        const cur = player.grounded ? imgs.run[player.frame] : imgs.jump;
        ctx.drawImage(cur, player.x, player.y, player.w, player.h);
    }
    requestAnimationFrame(draw);
}

function startCutscene() {
    cutsceneDiv.style.display = 'block';
    document.getElementById('ui').style.display = 'none';
    showSlide();
}

function showSlide() {
    if (currentSlide < slides.length) cutsceneImg.src = slides[currentSlide];
    else location.reload();
}

document.getElementById('start-btn').onclick = () => { gameState = 'PLAYING'; document.getElementById('menu').style.display = 'none'; document.getElementById('ui').style.display = 'block'; };
document.getElementById('next-btn').onclick = () => { currentSlide++; showSlide(); };
window.addEventListener('touchstart', (e) => { if (gameState === 'PLAYING' && player.grounded && e.target.tagName !== 'BUTTON') { player.dy = -player.jf; player.grounded = false; } });

setInterval(update, 1000/60);
draw();
</script>
</body>
</html>
