<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Altushka Run: Smooth Final</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Courier New', monospace; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        #ui, #menu, #cutscene { position: absolute; left: 0; width: 100%; height: 100%; text-align: center; z-index: 100; pointer-events: none; }
        #ui { top: 20px; height: auto; font-size: 28px; display: none; color: #ff00ff; text-shadow: 2px 2px #000; }
        
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0,0,0,0.6); }
        #menu h1 { color: #ff00ff; font-size: 42px; text-shadow: 3px 3px #000; margin-bottom: 30px; }
        
        /* ПЛАВНОЕ ПОЯВЛЕНИЕ СЛАЙДОВ */
        #cutscene { 
            display: none; 
            background: #000; 
            pointer-events: auto;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #cutscene img { 
            max-width: 90%; 
            max-height: 70%; 
            object-fit: contain; 
            border: 3px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Плавность появления */
        }
        #cutscene img.show { opacity: 1; }

        button { background: #ff00ff; border: none; padding: 20px 60px; color: white; font-size: 24px; border-radius: 12px; cursor: pointer; box-shadow: 0 6px #990099; font-weight: bold; pointer-events: auto; margin-top: 25px; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="menu">
        <h1>ALTUSHKA RUN</h1>
        <button id="start-btn">ИГРАТЬ</button>
    </div>
    <div id="cutscene">
        <img id="cutscene-img" src="" alt="Финал">
        <button id="next-btn">ДАЛЕЕ</button>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const cutsceneDiv = document.getElementById('cutscene');
const cutsceneImg = document.getElementById('cutscene-img');
const scoreSpan = document.getElementById('score');

const imgs = {
    bg: new Image(), beer: new Image(), jump: new Image(),
    run: [new Image(), new Image(), new Image()],
    house: new Image()
};
imgs.bg.src = 'bg.png'; 
imgs.beer.src = 'beer.png'; 
imgs.jump.src = 'jump.png';
imgs.run[0].src = 'run_1.png'; 
imgs.run[1].src = 'run_2.png'; 
imgs.run[2].src = 'run_3.png';
imgs.house.src = 'дом.png'; // Исправлено под твой GitHub

const slides = ['end_1.jpg', 'end_2.jpg', 'end_3.jpg', 'end_4.jpg', 'end_5.jpg'];
let currentSlide = 0;
let gameState = 'MENU';
let score = 0;
let gameSpeed = 8;
let houseX = -5000;

canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const groundY = canvas.height - (canvas.height / 3.5);

const player = { x: 50, y: groundY - 110, w: 90, h: 110, dy: 0, jf: 18, g: 0.85, grounded: false, frame: 0, tick: 0 };
let obstacles = [];

function update() {
    if (gameState !== 'PLAYING') return;

    player.dy += player.g;
    player.y += player.dy;
    if (player.y + player.h > groundY) { player.y = groundY - player.h; player.dy = 0; player.grounded = true; }
    if (player.grounded) { player.tick++; if (player.tick % 6 === 0) player.frame = (player.frame + 1) % 3; }

    if (score >= 28 && houseX < -1000) houseX = canvas.width;
    if (houseX > -1000) {
        houseX -= gameSpeed;
        if (player.x + player.w > houseX + 150) startCutscene();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        let o = obstacles[i];
        
        // УЛУЧШЕННЫЕ ХИТБОКСЫ (уменьшены зазоры на 25 пикселей)
        if (player.x + 25 < o.x + o.w && 
            player.x + player.w - 25 > o.x && 
            player.y + 10 < o.y + o.h && 
            player.y + player.h > o.y + 10) {
            location.reload();
        }
        
        if (o.x + o.w < 0) { obstacles.splice(i, 1); score++; scoreSpan.innerText = score; }
    }

    if (score < 28 && Math.random() < 0.02 && (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 400)) {
        obstacles.push({ x: canvas.width, y: groundY - 75, w: 45, h: 75 });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    if (gameState === 'PLAYING') {
        if (houseX > -1000) ctx.drawImage(imgs.house, houseX, groundY - 320, 320, 320);
        obstacles.forEach(o => ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h));
        const cur = player.grounded ? imgs.run[player.frame] : imgs.jump;
        ctx.drawImage(cur, player.x, player.y, player.w, player.h);
    }
    requestAnimationFrame(draw);
}

function startCutscene() {
    gameState = 'CUT';
    cutsceneDiv.style.display = 'flex';
    document.getElementById('ui').style.display = 'none';
    showSlide();
}

function showSlide() {
    if (currentSlide < slides.length) {
        cutsceneImg.classList.remove('show'); // Сначала гасим
        setTimeout(() => {
            cutsceneImg.src = slides[currentSlide];
            cutsceneImg.onload = () => cutsceneImg.classList.add('show'); // Проявляем после загрузки
        }, 100);
    } else {
        location.reload();
    }
}

document.getElementById('start-btn').onclick = () => { 
    gameState = 'PLAYING'; 
    document.getElementById('menu').style.display = 'none'; 
    document.getElementById('ui').style.display = 'block'; 
};

document.getElementById('next-btn').onclick = () => { currentSlide++; showSlide(); };

window.addEventListener('touchstart', (e) => { 
    if (gameState === 'PLAYING' && player.grounded && e.target.tagName !== 'BUTTON') { 
        player.dy = -player.jf; player.grounded = false; 
    } 
});

setInterval(update, 1000/60);
draw();
</script>
</body>
</html>
