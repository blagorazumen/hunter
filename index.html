<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TASHKENT: SUETA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --ivory: #fdf5e6; --gold: #d4af37; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; color: var(--ivory); font-family: serif; overflow: hidden; }
        
        .app { position: relative; height: 100vh; display: flex; flex-direction: column; padding: 20px; z-index: 5; }
        
        /* Баланс */
        .header { text-align: center; padding-top: 20px; }
        .balance { font-size: 36px; letter-spacing: 2px; color: var(--ivory); }
        .income-info { font-size: 11px; opacity: 0.6; text-transform: uppercase; margin-top: 5px; color: var(--gold); }

        /* Персонаж */
        .char-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .character-img { 
            max-width: 80%; max-height: 70vh; 
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
            transition: transform 0.05s;
        }
        .character-img:active { transform: scale(0.98); }

        /* Кнопка */
        .click-section { padding-bottom: 110px; display: flex; justify-content: center; }
        .main-btn { 
            width: 200px; height: 60px; border: 1px solid var(--gold); 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(212, 175, 55, 0.05); cursor: pointer; 
            letter-spacing: 5px; font-weight: bold; font-size: 18px;
        }

        /* Меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: #080808; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; padding-bottom: 15px; }
        .nav-item { background: none; border: none; color: var(--ivory); opacity: 0.4; font-size: 10px; letter-spacing: 1px; }
        .nav-item.active { opacity: 1; color: var(--gold); border-bottom: 1px solid var(--gold); }

        /* Окна */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; display: none; flex-direction: column; padding: 40px 20px; overflow-y: auto; }
        .dist-card { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .buy-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance"><span id="cash-display">328 000</span> <small>СУМ</small></div>
            <div id="income-display" class="income-info">Доход: 0 / сек</div>
        </div>

        <div class="char-container" onclick="doSueta()">
            <img src="1000031005.jpg" class="character-img" alt="Персонаж">
        </div>

        <div class="click-section">
            <div class="main-btn" onclick="doSueta()">СУЕТИТЬ</div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item" onclick="openTab('tasks')">ТЕМКИ</button>
            <button class="nav-item" onclick="openTab('shop')">МАГАЗИН</button>
            <button class="nav-item" onclick="closeTab()">ГЛАВНАЯ</button>
        </nav>
    </div>

    <div id="overlay" class="overlay">
        <div id="content"></div>
        <button onclick="closeTab()" style="margin-top: 30px; color: var(--gold); background: none; border: none; letter-spacing: 3px;">[ ЗАКРЫТЬ ]</button>
    </div>

    <script>
        let cash = 328000;
        let income = 0;
        let clickValue = 100;

        // Данные районов для "Сигаретных апаюшек"
        const districts = {
            D: { name: "Сергели", price: 1000000, inc: 17, count: 0 },
            C: { name: "Яшнабад", price: 5000000, inc: 100, count: 0 },
            B: { name: "Чиланзар", price: 15000000, inc: 500, count: 0 },
            S: { name: "Tashkent City", price: 200000000, inc: 15000, count: 0 }
        };

        function updateUI() {
            document.getElementById('cash-display').innerText = Math.floor(cash).toLocaleString('ru-RU');
            document.getElementById('income-display').innerText = "Доход: " + Math.floor(income) + " / сек";
        }

        function doSueta() {
            cash += clickValue;
            if (window.Telegram.WebApp.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            updateUI();
        }

        function openTab(type) {
            const ov = document.getElementById('overlay');
            const ct = document.getElementById('content');
            ov.style.display = 'flex';
            
            if(type === 'tasks') {
                ct.innerHTML = '<h2 style="margin-bottom:20px; letter-spacing:3px;">СИГАРЕТНЫЕ АПАЮШКИ</h2>';
                for (let key in districts) {
                    let d = districts[key];
                    let currentPrice = Math.floor(d.price * Math.pow(1.15, d.count));
                    ct.innerHTML += `
                        <div class="dist-card">
                            <div>
                                <b>${d.name} [${key}]</b><br>
                                <small style="opacity:0.6">+${d.inc}/сек | Куплено: ${d.count}</small>
                            </div>
                            <button class="buy-btn" onclick="buyDist('${key}')">${currentPrice.toLocaleString()} сум</button>
                        </div>
                    `;
                }
            } else if(type === 'shop') {
                ct.innerHTML = '<h2>МАГАЗИН</h2><p style="margin-top:20px; opacity:0.5;">Руль, колёса и одёжка в пути...</p>';
            }
        }

        function buyDist(key) {
            let d = districts[key];
            let currentPrice = Math.floor(d.price * Math.pow(1.15, d.count));
            if (cash >= currentPrice) {
                cash -= currentPrice;
                d.count++;
                income += d.inc;
                updateUI();
                openTab('tasks'); // Обновляем список
            } else {
                alert("Мало сум, суети еще!");
            }
        }

        function closeTab() { document.getElementById('overlay').style.display = 'none'; }

        setInterval(() => { if (income > 0) { cash += (income / 10); updateUI(); } }, 100);
        updateUI();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
