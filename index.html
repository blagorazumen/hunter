<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAVE RADAR TST</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        :root { 
            --bg: #000000; /* image_6.png */
            --accent: #ff00ff; /* image_6.png */
            --glow: #ffcc00; /* image_7.png */
            --text: #ffffff; 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* Экстремально контрастная розовая карта */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; filter: invert(100%) hue-rotate(300deg) brightness(1.2) contrast(1.5); }
        
        .ui-layer { position: relative; z-index: 100; pointer-events: none; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        
        .header { padding: 15px; background: rgba(0,0,0,0.8); text-align: center; pointer-events: auto; border-bottom: 2px solid var(--accent); }
        .status { font-size: 16px; color: var(--accent); text-transform: uppercase; font-weight: bold; text-shadow: 0 0 15px var(--accent); animation: flicker 2s infinite; }
        
        .bottom-nav { padding: 20px; display: flex; justify-content: center; pointer-events: auto; }
        .btn-add { 
            background: none; 
            color: var(--text); 
            border: 2px solid var(--text); 
            padding: 12px 25px; 
            font-weight: bold; 
            text-transform: uppercase; 
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .btn-add:active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px var(--accent); color: white; }

        @keyframes flicker { 0%, 19.999%, 22%, 62.999%, 64%, 100% { opacity: 1; } 20%, 21.999%, 63%, 63.999% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ui-layer">
        <div class="header">
            <div class="status">> SYSTEM_RAVE.TXT.RDR <</div>
        </div>
        <div class="bottom-nav">
            <button class="btn-add" onclick="addEvent()">[+] SUBMIT RAVE</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000';

        ymaps.ready(init);
        function init() {
            var myMap = new ymaps.Map("map", {
                center: [41.311081, 69.240562], // Ташкент
                zoom: 13,
                controls: []
            });

            // Кастомный маркер рейва с глитч-эффектом (violetDot + caption)
            var raveMarker = new ymaps.Placemark([41.2827, 69.2041], {
                balloonContentHeader: '<b style="color:#ff00ff">> TECHNO_BUNKER <</b>',
                balloonContentBody: 'LOC: INDUSTRIAL_ZONE<br>START: 23:30<br>Line-up: Local Residents',
                hintContent: 'RAVE.EXE'
            }, {
                preset: 'islands#pinkDotIconWithCaption' // image_6.png
            });

            myMap.geoObjects.add(raveMarker);
        }

        function addEvent() {
            tg.HapticFeedback.notificationOccurred('success');
            tg.showConfirm('Доступ к подаче заявок ограничен. Вы являетесь организатором?');
        }
    </script>
</body>
</html>
