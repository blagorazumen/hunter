<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter PRO</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>

    <style>
        :root { --bg: #000; --accent: #00d9ff; --panel: #0a0a0a; --text: #fff; --gray: #444; --red: #ff3333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Splash Screen */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader { width: 40px; height: 40px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Карта с Noir-фильтром */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: 0.3s; }
        .ymaps-2-1-79-map { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        /* UI Слой (pointer-events: none, чтобы клики шли на карту) */
        .ui-layer { position: relative; z-index: 100; pointer-events: none; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events { pointer-events: auto; }

        /* Хедер */
        .header { padding: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .version { font-size: 9px; color: #333; }

        /* Нижняя навигация */
        .bottom-nav { background: rgba(10,10,10,0.9); border-top: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-around; height: 75px; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        
        .nav-btn { color: var(--gray); font-size: 11px; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .nav-btn.active { color: var(--accent); text-shadow: 0 0 10px rgba(0,217,255,0.5); }

        /* Кнопка добавления (+ Цель) */
        .main-btn { 
            width: 60px; height: 60px; background: #000; border: 2px solid var(--accent); 
            border-radius: 15px; display: flex; align-items: center; justify-content: center; 
            margin-top: -40px; color: var(--accent); font-size: 28px; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .main-btn.active { background: var(--accent); color: #000; transform: rotate(45deg); box-shadow: 0 0 20px rgba(0,217,255,0.5); }

        /* Модальное окно добавления */
        .modal { position: fixed; bottom: -100%; left: 0; width: 100%; background: #0d0d0d; border-top: 2px solid var(--accent); padding: 25px; border-radius: 20px 20px 0 0; z-index: 2000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.9); }
        .modal.open { bottom: 0; }
        
        input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        
        .save-btn { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 14px; transition: 0.2s; }
        .save-btn:active { background: #fff; }

        /* Стили Балуна (всплывающего окна) */
        .ymaps-2-1-79-balloon__content { background: #111 !important; color: #fff !important; border-radius: 10px; border: 1px solid #333; padding: 15px !important; }
        .balloon-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        .balloon-type { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 10px; }
        .route-btn { display: block; width: 100%; padding: 10px; background: #222; color: #fff; text-align: center; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }

    </style>
</head>
<body>

<div id="splash">
    <div class="loader"></div>
    <p style="margin-top: 20px; font-size: 11px; letter-spacing: 3px; color: var(--accent)">INITIALIZING SYSTEM...</p>
</div>

<div id="map"></div>

<div class="ui-layer">
    <div class="header">
        <div class="status">● System Online // Tashkent Sector</div>
        <div class="version">v3.0 ZERO</div>
    </div>

    <div class="bottom-nav pointer-events">
        <div class="nav-btn" onclick="toggleScreen('base')">ARCHIVE</div>
        <div class="main-btn" id="add-trigger" onclick="activateAddMode()">+</div>
        <div class="nav-btn active" onclick="toggleScreen('map')">RADAR</div>
    </div>
</div>

<div id="modal" class="modal pointer-events">
    <h3 style="margin-top:0; color:var(--accent); font-weight: 300; letter-spacing: 1px;">TARGET ACQUIRED</h3>
    <input type="text" id="p-name" placeholder="OBJECT NAME (е.г., KFC Чиланзар)">
    <select id="p-type">
        <option value="free">FREE ACCESS</option>
        <option value="paid">RESTRICTED (PAID)</option>
    </select>
    <textarea id="p-note" rows="2" placeholder="Ориентир или код (optional)"></textarea>
    <button class="save-btn" onclick="confirmSave()">SAVE TO DATABASE</button>
    <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px; font-weight:bold;">CANCEL</button>
</div>

<div id="scr-base" class="screen" style="display:none; padding: 20px; background:#000; position:fixed; top:0; left:0; width:100%; height:calc(100% - 75px); z-index:500;">
    <h2 style="color:#fff">База данных</h2>
    <p style="color:#666">Здесь будет список всех твоих точек.</p>
</div>

<script>
    // Инициализация Telegram SDK
    const tg = window.Telegram.WebApp;
    tg.expand(); // Открыть на весь экранCompact Compact Compact
    tg.ready();

    let myMap, isAdding = false, tempCoords = null;
    let db = JSON.parse(localStorage.getItem('hunter_pro_db_v3') || '[]');

    // Функция тактильного отклика (Medium Impact)
    function haptic() {
        if(window.Telegram.WebApp.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('medium');
        }
    }

    // Инициализация карт
    ymaps.ready(() => {
        myMap = new ymaps.Map("map", { 
            center: [41.31, 69.24], // Ташкент
            zoom: 14, 
            controls: [] // Убираем стандартные кнопки
        }, {
            yandexMapDisablePoiInteractivity: true // Отключаем клики по стандартным POI
        });
        
        // Загружаем точки из базы
        db.forEach(p => renderMarker(p));

        // Слушаем клик по карте (только в режиме добавления)
        myMap.events.add('click', e => {
            if(!isAdding) return;
            haptic();
            tempCoords = e.get('coords');
            openModal();
        });

        // Скрываем Splash Screen через 1.5 сек
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
        }, 1500);
        
        // Авто-определение GPS при старте
        const location = ymaps.geolocation.get({ provider: 'browser', mapStateAutoApply: true });
        location.then(res => {
            res.geoObjects.options.set('preset', 'islands#blueCircleIcon');
            myMap.geoObjects.add(res.geoObjects);
        });
    });

    // Режим добавления цели
    function activateAddMode() {
        haptic();
        isAdding = !isAdding;
        const btn = document.getElementById('add-trigger');
        btn.classList.toggle('active');
        
        if(isAdding) {
            tg.MainButton.setText("SELECT LOCATION ON MAP").show();
            // tg.MainButton.onClick(() => { isAdding = false; activateAddMode(); }); // Отмена по кнопке
        } else {
            tg.MainButton.hide();
        }
    }

    // Открытие формы
    function openModal() {
        document.getElementById('modal').classList.add('open');
        tg.MainButton.hide(); // Прячем кнопку ТГ, чтобы не мешала форме
    }
    
    // Закрытие формы (Cancel)
    function closeModal() {
        haptic();
        document.getElementById('modal').classList.remove('open');
        activateAddMode(); // Сброс режима добавления
    }

    // Сохранение точки
    function confirmSave() {
        haptic();
        const p = {
            id: Date.now(),
            coords: tempCoords,
            name: document.getElementById('p-name').value || "TARGET",
            type: document.getElementById('p-type').value,
            note: document.getElementById('p-note').value
        };
        db.push(p);
        localStorage.setItem('hunter_pro_db_v3', JSON.stringify(db));
        renderMarker(p);
        
        // Сброс формы и режима
        document.getElementById('p-name').value = '';
        document.getElementById('p-note').value = '';
        document.getElementById('modal').classList.remove('open');
        activateAddMode();
        
        if(window.Telegram.WebApp.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // Отрисовка маркера на карте
    function renderMarker(p) {
        const color = p.type === 'free' ? '#00d9ff' : '#ff3333'; // Синий/Красный
        const marker = new ymaps.Placemark(p.coords, {
            balloonContent: `
                <div class="balloon-name">${p.name}</div>
                <div class="balloon-type">${p.type === 'free' ? '🟢 Free' : '🔴 Paid'}</div>
                <div style="font-size:12px; color:#aaa; margin-bottom:10px;">${p.note}</div>
                <a href="https://yandex.ru/maps/?rtext=~${p.coords[0]},${p.coords[1]}" target="_blank" class="route-btn">ЯНДЕКС.НАВИГАТОР</a>
            `
        }, {
            preset: 'islands#circleDotIcon', iconColor: color,
            balloonPanelMaxMapArea: 0 // Открывать балун на карте, а не панелью
        });
        myMap.geoObjects.add(marker);
    }

    // Переключение экранов (Радар / База)
    function toggleScreen(type) {
        haptic();
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        
        if(type === 'map') {
            document.querySelectorAll('.nav-btn')[2].classList.add('active');
            document.getElementById('map').style.opacity = '1';
        } else if(type === 'base') {
            document.querySelectorAll('.nav-btn')[0].classList.add('active');
            document.getElementById('scr-base').style.display = 'block';
            document.getElementById('map').style.opacity = '0.1'; // Приглушить карту
        }
        
        isAdding = false;
        document.getElementById('add-btn').classList.remove('active');
        tg.MainButton.hide();
    }
</script>

</body>
</html>
