        }
        .leader-item:last-child { border-bottom: none; }
        #cutscene {
            display: none; background: #000; pointer-events: auto;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            font-size: 20px; font-weight: bold;
        }
        .player-info { text-align: left; }
        .player-name { color: #00ffff; font-weight: bold; font-size: 14px; }
        .player-best { color: #ff00ff; font-size: 12px; }
        .save-status { font-size: 11px; color: #666; margin-top: 5px; }
        .save-status.synced { color: #00ff00; }

function saveSettings() { localStorage.setItem('ksshashka_settings', JSON.stringify(settings)); }

// === HAPTIC ===
function haptic(type = 'light') {
    if (!settings.haptic) return;
    if (tg.HapticFeedback) {
        const map = { light: 'light', medium: 'medium', heavy: 'heavy', success: 'success', error: 'error' };
        if (tg.HapticFeedback.impactOccurred && map[type]) tg.HapticFeedback.impactOccurred(map[type]);
    }
}

// === БД ===
async function fetchUserData() {
    updateSaveStatus('menu-save-status', 'pending', '⏳');
    try {
        const { data, error } = await _supabase.from('records').select('*').eq('username', playerName).single();
        if (error && error.code !== 'PGRST116') throw error;
        if (data) {
            pillsDb = data.pills || 0; boostsDb = data.speed || 0; bestScore = data.score || 0;
            document.getElementById('pills-count').innerText = pillsDb;            document.getElementById('boost-count').innerText = boostsDb;
            document.getElementById('best-score').innerText = bestScore;
            updateSaveStatus('menu-save-status', 'synced', '✓ Синхронизировано');
        } else updateSaveStatus('menu-save-status', 'synced', '✓ Новый игрок');
    } catch (e) { console.error(e); updateSaveStatus('menu-save-status', 'error', '⚠'); }
}

async function quickSave() {
    updateSaveStatus('cloud-status', 'pending', '☁️');
    try {
        const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
        if (data) {
            await _supabase.from('records').update({ pills: pillsDb, speed: boostsDb, score: Math.max(data.score, bestScore) }).eq('username', playerName);
        } else {
            await _supabase.from('records').insert([{ username: playerName, score: bestScore, pills: pillsDb, speed: boostsDb }]);
        }
        updateSaveStatus('cloud-status', 'synced', '☁️✓');
    } catch (e) { console.error(e); updateSaveStatus('cloud-status', 'error', '☁️⚠'); }
}

async function saveProgress(s) {
    if (s > bestScore) { bestScore = s; document.getElementById('best-score').innerText = bestScore; }
    try {
        const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
        if (data) {
            await _supabase.from('records').update({ score: bestScore, pills: pillsDb, speed: boostsDb }).eq('username', playerName);
        } else {
            await _supabase.from('records').insert([{ username: playerName, score: bestScore, pills: pillsDb, speed: boostsDb }]);
        }
        loadLeaderboard();
    } catch (e) { console.error(e); }
}

async function loadLeaderboard() {
    const list = document.getElementById('leader-list');
    try {
        const { data, error } = await _supabase.from('records').select('*').order('score', { ascending: false }).limit(10);
        if (error) { list.innerHTML = "⚠ Ошибка"; return; }
        if (data?.length) {
            list.innerHTML = data.map((p, i) => `<div class="leader-item"${p.username===playerName?' style="color:#ffff00;"':''}><span>${i+1}. ${p.username.substring(0,12)}</span><span>${p.score} 💊${p.pills||0} 🚀${p.speed||0}</span></div>`).join('');
        } else list.innerHTML = "📭 Пусто...";
    } catch (e) { list.innerHTML = "⚠ Ошибка"; }
}

function updateSaveStatus(id, status, text) { const el = document.getElementById(id); if (el) { el.className = 'save-status ' + status; el.innerText = text; } }
