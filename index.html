<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GATEKEEPER • ORG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        :root { --bg: #000; --ivory: #fdf5e6; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-style: italic; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000 !important; color: var(--ivory); font-family: 'Times New Roman', serif; overflow-x: hidden; }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; filter: invert(100%) sepia(20%) brightness(0.8) contrast(1.2); }
        
        .header { position: relative; z-index: 100; padding: 25px; text-align: center; background: rgba(0,0,0,0.8); border-bottom: 0.5px solid rgba(253, 245, 230, 0.15); }
        
        #submit-modal { 
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 85vh;
            background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(15px);
            border-top: 1px solid var(--ivory); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 200; padding: 30px; overflow-y: auto;
        }
        #submit-modal.open { bottom: 0; }
        
        input[type="text"], textarea, select { 
            width: 100%; background: transparent; border: none; 
            border-bottom: 0.5px solid rgba(253, 245, 230, 0.2); 
            color: var(--ivory); padding: 12px 0; margin: 5px 0; 
            font-family: inherit; font-size: 16px; outline: none; appearance: none;
        }

        /* Кастомный чекбокс */
        .checkbox-container { display: flex; align-items: center; margin: 15px 0; font-size: 14px; opacity: 0.8; }
        input[type="checkbox"] { width: 18px; height: 18px; margin-right: 10px; accent-color: var(--ivory); }

        /* Поле дресс-кода (скрытое) */
        #dc-description-wrapper { max-height: 0; overflow: hidden; transition: 0.4s ease-out; opacity: 0; }
        #dc-description-wrapper.visible { max-height: 100px; opacity: 1; margin-top: 5px; }
        
        .btn-send { 
            background: var(--ivory); color: #000; border: none; 
            width: 100%; padding: 18px; font-weight: bold; 
            text-transform: uppercase; margin-top: 25px; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="header">
        <div style="font-size:11px; letter-spacing: 4px; opacity: 0.8;"><i>GATEKEEPER • CONTROL</i></div>
    </div>

    <div id="submit-modal">
        <div style="font-size: 9px; letter-spacing: 2px; opacity: 0.5; margin-bottom: 15px;"><i>COORDINATES: <span id="coords-display">...</span></i></div>
        
        <input type="text" id="raveName" placeholder="Event Name">
        <input type="text" id="raveTime" placeholder="Date & Time">
        
        <select id="ageLimit">
            <option value="18+">Face Control: 18+</option>
            <option value="21+">Face Control: 21+</option>
            <option value="no limit">No age limit</option>
        </select>

        <label class="checkbox-container">
            <input type="checkbox" id="dc-trigger" onchange="toggleDressCode()"> 
            <i>Special Dress Code?</i>
        </label>
        
        <div id="dc-description-wrapper">
            <input type="text" id="dc-text" placeholder="Describe Dress Code (e.g. Total Black)">
        </div>

        <textarea id="raveDesc" rows="2" placeholder="Additional info..."></textarea>
        
        <button class="btn-send" onclick="sendData()">Deploy Event</button>
        <button onclick="closeModal()" style="background:none; border:none; color:rgba(253,245,230,0.4); width:100%; margin-top:15px; font-size:10px;"><i>[ DISMISS ]</i></button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let selectedCoords = null;
        tg.expand();

        function toggleDressCode() {
            const wrapper = document.getElementById('dc-description-wrapper');
            const isChecked = document.getElementById('dc-trigger').checked;
            wrapper.className = isChecked ? 'visible' : '';
            if(isChecked) tg.HapticFeedback.impactOccurred('light');
        }

        ymaps.ready(function() {
            var myMap = new ymaps.Map("map", { center: [41.311, 69.240], zoom: 13, controls: [] });
            myMap.events.add('click', function (e) {
                selectedCoords = e.get('coords');
                document.getElementById('coords-display').innerText = selectedCoords[0].toFixed(5) + " / " + selectedCoords[1].toFixed(5);
                tg.HapticFeedback.impactOccurred('medium');
                document.getElementById('submit-modal').classList.add('open');
            });
        });

        function closeModal() { document.getElementById('submit-modal').classList.remove('open'); }

        function sendData() {
            const data = {
                name: document.getElementById('raveName').value,
                time: document.getElementById('raveTime').value,
                age: document.getElementById('ageLimit').value,
                dc: document.getElementById('dc-trigger').checked ? document.getElementById('dc-text').value : "None",
                desc: document.getElementById('raveDesc').value,
                coords: selectedCoords
            };
            
            if (!data.name || !selectedCoords) { tg.showAlert("Incomplete data."); return; }
            
            const msg = `✨ NEW SUBMISSION\n\nName: ${data.name}\nTime: ${data.time}\nAge: ${data.age}\nDressCode: ${data.dc}\nCoords: ${data.coords}\nInfo: ${data.desc}`;
            tg.sendData(msg);
            tg.close();
        }
    </script>
</body>
</html>
