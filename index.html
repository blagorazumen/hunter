<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WC HUNTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance"><span id="cash-display">100 000</span> СУМ</div>
            <div id="income-display" class="income-text">ДОХОД: 0 / СЕК</div>
        </div>

        <div class="photo-zone">
            <div class="img-placeholder">МЕСТО ДЛЯ АРТА</div>
        </div>

        <div class="click-section">
            <div id="emoji-container"></div>
            <button class="main-btn" onclick="suetaClick()">СУЕТИТЬ</button>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="openShop()">🛒</button>
            <button class="nav-item" onclick="openAssets()">🛡️</button>
            <button class="nav-item" onclick="openMenu()">☰</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="overlay-header">
            <button class="nav-btn" id="back-btn">← НАЗАД</button>
            <div id="overlay-title" class="title-gold">МАГАЗИН</div>
            <button class="nav-btn" onclick="closeAll()">✕ ВЫХОД</button>
        </div>
        <div id="overlay-content" class="overlay-body"></div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
