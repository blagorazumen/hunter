<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ксюшачка^</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Courier New', monospace; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; transition: filter 3s ease; }
        #ui, #menu, #cutscene, #death-screen { position: absolute; left: 0; width: 100%; height: 100%; text-align: center; z-index: 100; pointer-events: none; }
        #ui { top: 20px; height: auto; font-size: 22px; display: none; color: #ff00ff; text-shadow: 2px 2px #000; display: flex; justify-content: space-around; width: 100%; }
        .overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0,0,0,0.8); overflow-y: auto; }
        h1 { color: #ff00ff; font-size: 42px; text-shadow: 3px 3px #000; margin-bottom: 20px; }
        #death-screen { display: none; }
        #death-msg { color: #00ffff; font-size: 24px; font-weight: bold; margin-bottom: 30px; text-shadow: 2px 2px #ff00ff; }
        #leaderboard { margin-top: 20px; width: 85%; background: rgba(255, 0, 255, 0.1); border: 1px solid #ff00ff; border-radius: 10px; padding: 10px; font-size: 14px; }
        .leader-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #444; padding: 5px 0; }
        #cutscene { display: none; background: #000; pointer-events: auto; position: fixed; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
        #cutscene img { max-width: 100%; max-height: 80vh; opacity: 0; transition: opacity 1s ease-in-out; border: 2px solid #ff00ff; }
        #cutscene img.show { opacity: 1; }
        button { background: #ff00ff; border: none; padding: 15px 40px; color: white; font-size: 18px; border-radius: 12px; cursor: pointer; box-shadow: 0 6px #990099; font-weight: bold; pointer-events: auto; margin: 10px; width: 250px;}
        button:active { transform: translateY(3px); box-shadow: 0 2px #990099; }
        .btn-free { background: #00ffff; box-shadow: 0 6px #009999; color: #000; }
        .pill-ui { color: #ffff00; }
    </style>
</head>
<body>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div class="pill-ui">PILLS: <span id="pills-count">0</span></div>
    </div>
    <div id="menu" class="overlay">
        <h1>КСЮШАЧКА^</h1>
        <button onclick="startGame('STORY')">СЮЖЕТ</button>
        <button class="btn-free" onclick="startGame('FREE')">СВОБОДНЫЙ ЗАБЕГ</button>
        <div id="leaderboard">
            <div style="font-weight:bold; color:#00ffff; margin-bottom:5px;">ТОП-10:</div>
            <div id="leader-list">Синхронизация...</div>
        </div>
    </div>
    <div id="death-screen" class="overlay">
        <h1>ППЦ;)</h1>
        <div id="death-msg"></div>
        <button onclick="location.reload()">В МЕНЮ</button>
    </div>
    <div id="cutscene">
        <img id="cutscene-img" src="" alt="Финал">
        <button id="next-btn" style="margin-top:20px;">ДАЛЕЕ</button>
    </div>
    <canvas id="game"></canvas>

<script>
// --- КОНФИГ SUPABASE ---
const SUPABASE_URL = 'https://rfjruwbeiaahegzmowcc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmanJ1d2JlaWFhaGVnem1vd2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDMyMjgsImV4cCI6MjA4OTUxOTIyOH0.59jjm9JpMy3m8oZXTfomS4PuTYjDgTfZiSfhCNksPt8'; 
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- TELEGRAM DATA ---
const tg = window.Telegram.WebApp;
tg.expand();
const playerName = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Анонимный Скуф";

// --- ЛОГИКА БАЗЫ ---
async function saveProgress(s, p) {
    // Ищем, есть ли уже такой игрок
    const { data } = await _supabase.from('records').select('*').eq('username', playerName).single();
    
    if (data) {
        // Если игрок есть, обновляем рекорд (если новый больше) и плюсуем пилсы
        const newScore = Math.max(data.score, s);
        const newPills = (data.pills || 0) + p;
        await _supabase.from('records').update({ score: newScore, pills: newPills }).eq('username', playerName);
    } else {
        // Если игрока нет, создаем новую запись
        await _supabase.from('records').insert([{ username: playerName, score: s, pills: p }]);
    }
    loadLeaderboard();
}

async function loadLeaderboard() {
    const list = document.getElementById('leader-list');
    const { data, error } = await _supabase.from('records').select('*').order('score', { ascending: false }).limit(10);
    if (error) { list.innerHTML = "Ошибка базы"; return; }
    if (data && data.length > 0) {
        list.innerHTML = data.map((p, i) => `<div class="leader-item"><span>${i+1}. ${p.username}</span><span>${p.score} (💊${p.pills || 0})</span></div>`).join('');
    } else {
        list.innerHTML = "Таблица пока пуста...";
    }
}
loadLeaderboard();

// --- ИГРОВОЙ ДВИЖОК ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const deathScreen = document.getElementById('death-screen');
const deathMsg = document.getElementById('death-msg');
const cutsceneDiv = document.getElementById('cutscene');
const cutsceneImg = document.getElementById('cutscene-img');

const imgs = { bg: new Image(), beer: new Image(), pills: new Image(), jump: new Image(), run: [new Image(), new Image(), new Image()], house: new Image() };
imgs.bg.src = 'bg.png'; imgs.beer.src = 'beer.png'; imgs.pills.src = 'pills.png'; imgs.jump.src = 'jump.png';
imgs.run[0].src = 'run_1.png'; imgs.run[1].src = 'run_2.png'; imgs.run[2].src = 'run_3.png';
imgs.house.src = 'house.png';

const slides = ['end_1.jpg', 'end_2.jpg', 'end_3.jpg', 'end_4.jpg', 'end_5.jpg'];
const phrases = ["АНДЕГРАУНД ПАЛЮБОМУ", "ЧИЛАНЗАРСКИЕ ДВОРИКИ ЖДУТ", "ТЫ ЖЕ ПИТЬ БРОСИЛА", "КИБРАЙ ОКАЗАЛСЯ СИЛЬНЕЕ", "ЭТО ТЕБЕ НЕ ВПИСКА", "ПЕРЕБРАЛА?"];

let currentSlide = 0, gameState = 'MENU', score = 0, pillsSession = 0, gameSpeed = 7.2, houseX = -5000, gameMode = 'STORY';
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const groundY = canvas.height - (canvas.height / 3.5);

const player = { x: 50, y: groundY - 110, w: 90, h: 110, dy: 0, jf: 17.5, g: 0.75, grounded: false, frame: 0, tick: 0 };
let obstacles = [];
let collectables = [];

function startGame(mode) {
    gameMode = mode;
    gameState = 'PLAYING';
    document.getElementById('menu').style.display = 'none';
    document.getElementById('ui').style.display = 'flex';
}

function update() {
    if (gameState !== 'PLAYING') return;

    player.dy += player.g; player.y += player.dy;
    if (player.y + player.h > groundY) { player.y = groundY - player.h; player.dy = 0; player.grounded = true; }
    if (player.grounded) { player.tick++; if (player.tick % 7 === 0) player.frame = (player.frame + 1) % 3; }

    if (gameMode === 'STORY' && score >= 28 && houseX < -1000) houseX = canvas.width;
    if (houseX > -1000) {
        houseX -= gameSpeed;
        if (player.x + player.w > houseX + 100) {
            gameState = 'WAIT_FINALE';
            canvas.style.filter = 'brightness(0)';
            setTimeout(startCutscene, 3000);
        }
    }

    // Препятствия (Пиво)
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        let o = obstacles[i];
        if (player.x + 35 < o.x + o.w && player.x + player.w - 35 > o.x && player.y + 10 < o.y + o.h && player.y + player.h > o.y + 10) {
            gameState = 'DEAD';
            if(gameMode === 'FREE') saveProgress(score, pillsSession); 
            deathMsg.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            deathScreen.style.display = 'flex';
        }
        if (o.x + o.w < 0) { obstacles.splice(i, 1); score++; document.getElementById('score').innerText = score; }
    }

    // Предметы (Пилсы)
    for (let i = collectables.length - 1; i >= 0; i--) {
        collectables[i].x -= gameSpeed;
        let c = collectables[i];
        if (player.x < c.x + c.w && player.x + player.w > c.x && player.y < c.y + c.h && player.y + player.h > c.y) {
            pillsSession++;
            document.getElementById('pills-count').innerText = pillsSession;
            collectables.splice(i, 1);
        } else if (c.x + c.w < 0) collectables.splice(i, 1);
    }

    // Спавн пива
    if ((gameMode === 'FREE' || score < 28) && Math.random() < 0.04 && (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 300)) {
        obstacles.push({ x: canvas.width, y: groundY - 75, w: 45, h: 75 });
    }
    // Спавн пилсов (реже)
    if (Math.random() < 0.01 && (collectables.length === 0 || collectables[collectables.length-1].x < canvas.width - 500)) {
        collectables.push({ x: canvas.width, y: groundY - 140, w: 40, h: 40 });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    if (gameState === 'PLAYING' || gameState === 'WAIT_FINALE') {
        if (houseX > -1000) ctx.drawImage(imgs.house, houseX, groundY - 320, 320, 320);
        obstacles.forEach(o => ctx.drawImage(imgs.beer, o.x, o.y, o.w, o.h));
        collectables.forEach(c => ctx.drawImage(imgs.pills, c.x, c.y, c.w, c.h));
        const cur = player.grounded ? imgs.run[player.frame] : imgs.jump;
        ctx.drawImage(cur, player.x, player.y, player.w, player.h);
    }
    requestAnimationFrame(draw);
}

function startCutscene() {
    gameState = 'CUT';
    cutsceneDiv.style.display = 'flex';
    document.getElementById('ui').style.display = 'none';
    showSlide();
}

function showSlide() {
    if (currentSlide < slides.length) {
        cutsceneImg.classList.remove('show');
        setTimeout(() => {
            cutsceneImg.src = slides[currentSlide];
            cutsceneImg.onload = () => cutsceneImg.classList.add('show');
        }, 100);
    } else location.reload();
}

document.getElementById('next-btn').onclick = () => { currentSlide++; showSlide(); };
window.addEventListener('touchstart', (e) => { 
    if (gameState === 'PLAYING' && player.grounded && e.target.tagName !== 'BUTTON') { 
        player.dy = -player.jf; player.grounded = false; 
    } 
});

setInterval(update, 1000/60);
draw();
</script>
</body>
</html>
