<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pill Catch</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffff; font-size: 24px; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        .btn { position: absolute; bottom: 40px; padding: 20px; background: rgba(0,255,255,0.1); color: #00ffff; border: 3px solid #00ffff; border-radius: 50%; width: 70px; height: 70px; font-size: 35px; display: flex; align-items: center; justify-content: center; user-select: none; z-index: 20; -webkit-tap-highlight-color: transparent; }
        #left { left: 30px; } #right { right: 30px; }
        #back { position: absolute; top: 20px; left: 20px; color: #ff00ff; text-decoration: none; font-weight: bold; z-index: 30; border: 1px solid #ff00ff; padding: 5px 10px; }
    </style>
</head>
<body>
    <a href="../index.html" id="back">< Назад</a>
    <div id="ui">ТАБЛЕТОК: <span id="score">0</span></div>
    <div id="left" class="btn">←</div>
    <div id="right" class="btn">→</div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const imgs = {
    bg: new Image(),
    pill: new Image(),
    beer: new Image(),
    player: new Image()
};

// Пути ведут в основную папку (на один уровень выше)
imgs.bg.src = '../bg.png';
imgs.pill.src = '../pill.png';
imgs.beer.src = '../beer.png';
imgs.player.src = '../run_1.png';

let score = 0;
const p = {
    x: canvas.width / 2 - 45,
    y: canvas.height - 150,
    w: 90,
    h: 110,
    speed: 9
};

let items = [];
let keys = { L: false, R: false };

function spawn() {
    const type = Math.random() > 0.35 ? 'pill' : 'beer';
    items.push({
        x: Math.random() * (canvas.width - 50),
        y: -60,
        w: 45,
        h: 50,
        type: type,
        speed: 5 + Math.random() * 5
    });
}

function update() {
    if (keys.L && p.x > 0) p.x -= p.speed;
    if (keys.R && p.x < canvas.width - p.w) p.x += p.speed;

    for (let i = items.length - 1; i >= 0; i--) {
        items[i].y += items[i].speed;

        // Проверка столкновения
        if (items[i].x < p.x + p.w - 20 && 
            items[i].x + items[i].w > p.x + 20 && 
            items[i].y < p.y + p.h - 20 && 
            items[i].y + items[i].h > p.y + 20) {
            
            if (items[i].type === 'pill') {
                score++;
                document.getElementById('score').innerText = score;
                items.splice(i, 1);
            } else {
                alert("ППЦ;) ПЕРЕБРАЛА!");
                location.reload();
            }
        } else if (items[i].y > canvas.height) {
            items.splice(i, 1);
        }
    }

    if (Math.random() < 0.05) spawn();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Отрисовка фона
    if (imgs.bg.complete) ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);
    
    // Отрисовка Ксюши
    if (imgs.player.complete) ctx.drawImage(imgs.player, p.x, p.y, p.w, p.h);

    // Отрисовка падающих предметов
    items.forEach(it => {
        const img = it.type === 'pill' ? imgs.pill : imgs.beer;
        if (img.complete) ctx.drawImage(img, it.x, it.y, it.w, it.h);
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Управление для тачскрина
const lBtn = document.getElementById('left');
const rBtn = document.getElementById('right');

lBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.L = true; });
lBtn.addEventListener('touchend', () => keys.L = false);
rBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.R = true; });
rBtn.addEventListener('touchend', () => keys.R = false);

// Старт
loop();
</script>
</body>
</html>
